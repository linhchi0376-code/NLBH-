id: "c1", n: "1", title: "Overview of Insurance", vi: "Tổng quan về bảo hiểm",
sections: [
{ id: "c1-risk", title: "Risk, uncertainty và probability", html: `
<p>Hiểu thông thường, <b>risk</b> là sự không chắc chắn về tương lai, dẫn đến kết quả bất lợi ngoài mong đợi.</p>
<table><tr><th>Khái niệm</th><th>Định nghĩa (slide)</th><th>Gợi nhớ</th></tr>
<tr><td><b>Risk</b></td><td>Dùng khi <b>xác suất</b> của các kết quả có thể <b>ước lượng</b> được với độ chính xác nhất định</td><td>Đo được</td></tr>
<tr><td><b>Uncertainty</b></td><td>Dùng khi xác suất <b>không thể ước lượng</b></td><td>Không đo được</td></tr>
<tr><td><b>Objective risk</b> (degree of risk)</td><td>Độ biến thiên tương đối của tổn thất thực tế so với tổn thất kỳ vọng (relative variation of actual loss from expected loss)</td><td>Tính được bằng số, giảm khi có nhiều đơn vị rủi ro</td></tr>
<tr><td><b>Subjective risk</b></td><td>Sự bất định dựa trên trạng thái tinh thần, nhận thức của một người</td><td>Cảm giác lo lắng của từng người</td></tr>
<tr><td><b>Chance of loss</b></td><td>Xác suất một sự kiện xảy ra</td><td>Khác với <i>degree of risk</i></td></tr>
<tr><td><b>Objective probability</b></td><td>Tần suất tương đối dài hạn của một sự kiện, dựa trên giả định có vô hạn quan sát và điều kiện nền không đổi</td><td>Từ dữ liệu</td></tr>
<tr><td><b>Subjective probability</b></td><td>Ước tính cá nhân về khả năng xảy ra tổn thất</td><td>Từ cảm nhận</td></tr></table>
<div class="warn"><b>Dễ nhầm:</b> chance of loss (xác suất xảy ra) khác objective risk (độ lệch giữa tổn thất thực và kỳ vọng). Ví dụ: chance of loss là 1%, nhưng objective risk nói về việc năm nay có thể có 0 hay 3 vụ so với kỳ vọng 1 vụ.</div>` },

{ id: "c1-peril", title: "Peril và hazard", html: `
<p><b>Peril</b> là nguyên nhân trực tiếp gây ra tổn thất. <b>Hazard</b> là điều kiện làm tăng xác suất hoặc mức độ nghiêm trọng của tổn thất.</p>
<div class="def">Ví dụ chuẩn của cô: <b>Lũ lụt là peril</b> (nguyên nhân chính), <b>nhà gần sông là hazard</b>.</div>
<h4>Các loại peril</h4>
<ul><li><b>Natural perils:</b> ít kiểm soát được (bão, sét, đau tim)</li>
<li><b>Human perils:</b> do con người kiểm soát được (chiến tranh, trộm cắp)</li>
<li><b>Economic perils:</b> ví dụ công nhân đình công (employee strike)</li></ul>
<h4>Các loại hazard</h4>
<table><tr><th>Nhóm</th><th>Loại</th><th>Định nghĩa</th></tr>
<tr><td rowspan="1"><b>Tangible</b></td><td><b>Physical hazard</b></td><td>Điều kiện vật chất hữu hình trong môi trường ảnh hưởng đến tần suất/mức độ tổn thất</td></tr>
<tr><td rowspan="3"><b>Intangible</b><br>(thái độ, điều kiện văn hóa phi vật chất)</td><td><b>Moral hazard</b></td><td>Sự <b>không trung thực</b> hoặc khiếm khuyết về tư cách của một người làm tăng tần suất/mức độ tổn thất</td></tr>
<tr><td><b>Morale hazard</b> (attitudinal)</td><td>Sự <b>cẩu thả, thờ ơ</b> với tổn thất, làm tăng tần suất/mức độ tổn thất</td></tr>
<tr><td><b>Legal hazard</b></td><td>Đặc điểm của hệ thống pháp luật hoặc môi trường pháp lý làm tăng tần suất/mức độ tổn thất</td></tr></table>
<div class="tip"><b>Mẹo nhớ:</b> Moral = Mờ ám (cố ý, gian lận). Morale = Mặc kệ (cẩu thả, vì đã có bảo hiểm). Legal = Luật (án phạt cao, bồi thường lớn).</div>
<h4>Bài tập phân loại hazard (cô cho bảng trống)</h4>
<table><tr><th>Tình huống</th><th>Loại</th><th>Giải thích</th></tr>
<tr><td>Nhà máy chứa hóa chất dễ cháy cạnh nguồn nhiệt</td><td>Physical hazard</td><td>Điều kiện vật chất làm tăng khả năng cháy</td></tr>
<tr><td>Cố ý đốt kho đã mua bảo hiểm để lấy tiền</td><td>Moral hazard</td><td>Không trung thực, cố ý gây tổn thất</td></tr>
<tr><td>Lái xe kém cẩn thận vì có bảo hiểm toàn diện</td><td>Morale hazard</td><td>Thờ ơ, chủ quan vì đã được bảo vệ</td></tr>
<tr><td>Luật mới cho phép tòa án phán bồi thường thương tật cao hơn nhiều</td><td>Legal hazard</td><td>Môi trường pháp lý làm tăng mức độ tổn thất</td></tr>
<tr><td>Bệnh viện có thiết bị phòng cháy lỗi thời</td><td>Physical hazard</td><td>Điều kiện vật chất yếu kém</td></tr>
<tr><td>Công ty để dữ liệu khách hàng trên máy tính không bảo mật</td><td>Physical hazard (hệ thống không bảo mật); có thể lập luận là morale hazard nếu do ban lãnh đạo thờ ơ</td><td>Nên nêu rõ lập luận bạn chọn</td></tr></table>` },

{ id: "c1-class", title: "Phân loại rủi ro", html: `
<table><tr><th>Cặp phân loại</th><th>Định nghĩa</th></tr>
<tr><td><b>Pure risk</b></td><td>Chỉ có khả năng <b>tổn thất hoặc không tổn thất</b> (không có lãi)</td></tr>
<tr><td><b>Speculative risk</b></td><td>Có thể <b>lãi hoặc lỗ</b> (đầu tư, cờ bạc)</td></tr>
<tr><td><b>Diversifiable risk</b></td><td>Chỉ ảnh hưởng cá nhân hoặc nhóm nhỏ, không ảnh hưởng toàn nền kinh tế (cháy nhà, trộm xe)</td></tr>
<tr><td><b>Non-diversifiable risk</b></td><td>Ảnh hưởng toàn nền kinh tế hoặc số lượng lớn người/nhóm (lạm phát, suy thoái, thiên tai quy mô lớn)</td></tr>
<tr><td><b>Enterprise risk</b></td><td>Tất cả các rủi ro lớn của doanh nghiệp: pure, speculative, strategic, operational, financial</td></tr>
<tr><td><b>Financial risk</b></td><td>Bất định về tổn thất do biến động bất lợi của giá hàng hóa, lãi suất, tỷ giá, tiền tệ</td></tr>
<tr><td><b>Enterprise risk management (ERM)</b></td><td>Gộp mọi rủi ro lớn của doanh nghiệp vào <b>một chương trình xử lý thống nhất</b></td></tr></table>
<div class="tip"><b>Điểm ăn tiền:</b> Insurer thường chỉ bảo hiểm <b>pure risk</b>, và thường là <b>diversifiable risk</b> (vì rủi ro hệ thống quá lớn).</div>
<h4>Bài bảng cô giao: Risk Type, Example, Suggested Control (Starbucks, Tesla, Samsung, Vietnam Airlines)</h4>
<p>Đây là đáp án gợi ý tự soạn (slide chỉ đưa khung bảng), bạn nên viết lại bằng ví dụ của chính mình.</p>
<table><tr><th>Risk type</th><th>Ví dụ</th><th>Biện pháp</th></tr>
<tr><td>Pure</td><td>Vietnam Airlines: tai nạn máy bay, cháy hangar; Starbucks: cháy cửa hàng</td><td>Mua bảo hiểm hàng không/tài sản, bảo trì, huấn luyện an toàn</td></tr>
<tr><td>Strategic</td><td>Tesla: đối thủ EV cạnh tranh giá, thay đổi công nghệ pin; Samsung: tụt hậu về chip</td><td>Nghiên cứu thị trường, đa dạng hóa sản phẩm, R&amp;D</td></tr>
<tr><td>Operational</td><td>Samsung: gián đoạn chuỗi cung ứng, lỗi sản xuất; Starbucks: nhân viên sai sót, hỏng thiết bị</td><td>Quy trình kiểm soát chất lượng, đào tạo, kế hoạch dự phòng</td></tr>
<tr><td>Financial</td><td>Vietnam Airlines: giá nhiên liệu và tỷ giá USD; Starbucks: giá cà phê hạt</td><td>Hedging nhiên liệu/tỷ giá, hợp đồng kỳ hạn</td></tr></table>` },

{ id: "c1-exposure", title: "Rủi ro của cá nhân, doanh nghiệp và gánh nặng với xã hội", html: `
<h4>Rủi ro của cá nhân và gia đình</h4>
<ul><li><b>Personal risks:</b> chết sớm (premature death), thu nhập không đủ khi nghỉ hưu, ốm đau, thất nghiệp</li>
<li><b>Property risks:</b> tổn thất trực tiếp (<b>direct loss</b>) và tổn thất gián tiếp/hệ quả (<b>indirect/consequential loss</b>)</li>
<li><b>Liability risks:</b> ai cũng có thể bị buộc phải chịu trách nhiệm vì gây thiệt hại cho người khác</li></ul>
<h4>Rủi ro thương mại (commercial risks)</h4>
<ul><li>Property risks, liability risk, <b>loss of business income</b></li>
<li>Các rủi ro khác: crime exposures, human resources exposures, foreign loss exposures, intangible property exposures, government exposures</li></ul>
<h4>Gánh nặng của rủi ro với xã hội (3 burdens)</h4>
<ol><li>Quỹ khẩn cấp (emergency fund) phải tăng lên</li>
<li>Xã hội bị thiếu hụt một số hàng hóa và dịch vụ (society is deprived of certain goods and services)</li>
<li>Lo lắng và sợ hãi (worry and fear)</li></ol>` },

{ id: "c1-handle", title: "Cách xử lý rủi ro (risk management techniques)", html: `
<table><tr><th>Kỹ thuật</th><th>Nội dung</th><th>Ví dụ</th></tr>
<tr><td><b>Risk avoidance</b></td><td>Tránh hoàn toàn rủi ro bằng cách không làm hoạt động gây rủi ro</td><td>Không chạy bộ trong công viên nguy hiểm</td></tr>
<tr><td><b>Loss prevention</b></td><td>Giảm <b>xác suất/tần suất</b> xảy ra tổn thất</td><td>Lái xe an toàn, lắp báo khói</td></tr>
<tr><td><b>Loss reduction</b></td><td>Giảm <b>mức độ nghiêm trọng</b> khi tổn thất đã xảy ra (kể cả khi phòng ngừa chặt, một số tổn thất vẫn xảy ra)</td><td>Hệ thống sprinkler, bình chữa cháy</td></tr>
<tr><td><b>Risk financing</b></td><td>Chuẩn bị nguồn tiền để bù tổn thất: retention, non-insurance transfer, insurance</td><td>Xem bảng dưới</td></tr></table>
<p>Avoidance, prevention, reduction nằm trong nhóm <b>risk control</b>. Retention, transfer, insurance nằm trong nhóm <b>risk financing</b>.</p>
<h4>Ba hình thức risk financing</h4>
<table><tr><th>Hình thức</th><th>Nội dung chính</th></tr>
<tr><td><b>Retention</b></td><td>Cá nhân/doanh nghiệp tự giữ lại một phần hoặc toàn bộ tổn thất. Có thể <b>active</b> (chủ động) hoặc <b>passive</b> (bị động, do không nhận ra rủi ro). Dạng đặc biệt: <b>self-insurance</b></td></tr>
<tr><td><b>Non-insurance transfer</b></td><td>Chuyển rủi ro cho bên khác không phải insurer: (1) chuyển bằng hợp đồng (contracts, hold-harmless clause), (2) <b>hedging</b> rủi ro giá, (3) thành lập công ty (<b>incorporation</b>) để giới hạn trách nhiệm</td></tr>
<tr><td><b>Insurance</b></td><td>Chuyển <b>pure risk</b> cho insurer. Dùng <b>pooling</b> để dàn trải tổn thất của số ít cho cả nhóm, thay tổn thất thực bằng tổn thất bình quân. Dùng <b>law of large numbers</b> để dự đoán chính xác hơn</td></tr></table>
<div class="tip"><b>Quy tắc chọn kỹ thuật:</b> tổn thất nhỏ, ít xảy ra thì <b>retain</b>. Tổn thất lớn, có thể gây phá sản thì <b>insurance</b> (hoặc transfer). Hoạt động quá nguy hiểm, không cần thiết thì <b>avoid</b>. Muốn giảm khả năng/mức độ thì <b>prevention/reduction</b>.</div>
<h4>Case Jack: xe bị trộm</h4>
<p>Ba cách tài trợ: <b>borrow, savings, insurance</b>. Hệ quả tài chính ngắn hạn: mất phương tiện đi làm, phải chi tiền mua xe mới. Dài hạn: nợ lãi vay, mất khoản tiết kiệm dự phòng. Vay: có xe ngay nhưng chịu lãi, áp lực trả nợ. Dùng tiết kiệm: không lãi nhưng cạn quỹ khẩn cấp. Auto insurance (nếu có comprehensive/theft): được bồi thường theo hợp đồng, giữ nguyên quỹ tiết kiệm. Phòng ngừa: khóa chống trộm, GPS, đỗ nơi có camera, đậu garage.</p>
<h4>Case Michael: chọn kỹ thuật cho từng exposure</h4>
<table><tr><th>Exposure</th><th>Kỹ thuật phù hợp</th><th>Lý do</th></tr>
<tr><td>a. Hư hại vật chất chiếc Ford 2003 ($2,500) do va chạm</td><td>Retention (không mua collision), kèm loss prevention</td><td>Giá trị xe thấp, phí collision có thể cao so với mức bồi thường</td></tr>
<tr><td>b. Bị kiện trách nhiệm do lái xe bất cẩn</td><td>Insurance (auto liability)</td><td>Mức tổn thất có thể rất lớn, vượt khả năng tự chịu</td></tr>
<tr><td>c. Mất toàn bộ tài sản cá nhân ($10,000) do cháy bếp</td><td>Insurance (renters insurance), cộng loss prevention</td><td>Giá trị đáng kể với một sinh viên, xác suất thấp</td></tr>
<tr><td>d. Mất một chiếc kính áp tròng</td><td>Retention</td><td>Tổn thất rất nhỏ, dễ dự đoán</td></tr>
<tr><td>e. Giường nước rò rỉ gây hư hại căn hộ</td><td>Avoidance hoặc loss prevention (bỏ giường nước, kiểm tra thường xuyên); liability phần hư hại căn hộ dùng insurance</td><td>Tổn thất đã từng xảy ra, có thể loại bỏ nguồn rủi ro</td></tr>
<tr><td>f. Bị tấn công thể xác khi chạy bộ trong công viên nguy hiểm</td><td>Avoidance (đổi nơi chạy), loss prevention</td><td>Rủi ro rõ ràng và có thể tránh được</td></tr>
<tr><td>g. Mất tiền học phí hỗ trợ vì cha bị chết do tai nạn</td><td>Insurance (bảo hiểm nhân thọ cho cha mẹ, human life value)</td><td>Chết sớm là tổn thất lớn và không thể ngăn chặn hoàn toàn</td></tr></table>` },

{ id: "c1-ins", title: "Insurance: định nghĩa, cơ chế, bản chất", html: `
<h4>Hai cách định nghĩa trong slide</h4>
<ul><li><b>Theo hợp đồng (risk transfer mechanism):</b> người được bảo hiểm chuyển hậu quả tài chính của rủi ro cho insurer, đổi lại trả <b>premium</b>.</li>
<li><b>Theo tính xã hội (social device):</b> một nhóm cá nhân (insureds) chuyển rủi ro cho insurer để gộp kinh nghiệm tổn thất, cho phép dự đoán thống kê tổn thất, và chi trả (indemnity) từ quỹ do tất cả thành viên đóng góp (premiums).</li>
<li><b>Định nghĩa dài (Rejda):</b> insurance là <i>pooling of fortuitous losses</i> bằng cách chuyển rủi ro cho insurer, insurer đồng ý bồi thường (indemnify) tổn thất cho insureds, cung cấp các lợi ích tài chính khác khi tổn thất xảy ra, hoặc cung cấp dịch vụ liên quan đến rủi ro.</li></ul>
<h4>Cơ chế hoạt động</h4>
<p>Clients (insureds) đóng <b>premiums</b> vào <b>insurance fund</b>. Insurer quản lý quỹ. Khi rủi ro xảy ra, insureds nhận <b>indemnity</b> từ quỹ.</p>
<h4>Bốn đặc điểm cốt lõi</h4>
<table><tr><th>Đặc điểm</th><th>Nội dung</th></tr>
<tr><td><b>Pooling of losses</b></td><td>Trái tim của bảo hiểm. Dàn trải tổn thất của số ít cho cả nhóm, thay actual loss bằng average loss. Hàm ý: (1) cả nhóm cùng chia sẻ tổn thất, (2) dự đoán tổn thất tương lai tương đối chính xác nhờ <b>law of large numbers</b></td></tr>
<tr><td><b>Payment of fortuitous losses</b></td><td>Tổn thất bất ngờ, ngoài dự tính của insured, xảy ra do ngẫu nhiên (accidental). Law of large numbers giả định tổn thất ngẫu nhiên và xảy ra tình cờ</td></tr>
<tr><td><b>Risk transfer</b></td><td>Chuyển pure risk từ insured sang insurer (thường có tài chính mạnh hơn). Tổn thất của insured có thể bằng 0 hoặc rất lớn; insurer nhận phí để chấp nhận sự biến động đó. Hợp đồng thường tính bằng tiền, nhưng có loại bồi thường bằng dịch vụ</td></tr>
<tr><td><b>Indemnification</b></td><td>Insured được đưa về <b>gần vị trí tài chính trước khi tổn thất</b>. Ví dụ: nhà cháy được bồi thường; bị kiện do lái xe cẩu thả, bảo hiểm trách nhiệm trả phần phải bồi thường; tàn tật nặng, bảo hiểm thu nhập thay thế ít nhất một phần tiền lương</td></tr></table>` },

{ id: "c1-roles", title: "Vai trò của bảo hiểm", html: `
<table><tr><th>Economic roles</th><th>Social roles</th></tr>
<tr><td><ul><li>Financial stability for participants</li><li>Protect investments</li><li>Effective capital mobilization channel</li><li>State budget stability</li></ul></td>
<td><ul><li>Contribute to social security</li><li>Promote a safer and more stable society</li><li>Provide peace of mind for individuals</li><li>Create employment opportunities</li></ul></td></tr></table>
<div class="tip"><b>Mẹo nhớ:</b> Economic có 4 ý bắt đầu bằng tài chính (stability, investments, capital, budget). Social có 4 ý xoay quanh an sinh (security, safe society, peace of mind, employment).</div>` },

{ id: "c1-adv", title: "Adverse selection, insurance vs gambling vs hedging", html: `
<h4>Adverse selection</h4>
<div class="def"><b>Adverse selection</b> là xu hướng những người có <b>xác suất tổn thất cao hơn trung bình</b> tìm mua bảo hiểm (hoặc mua nhiều hơn) với mức phí tiêu chuẩn.</div>
<p><b>Các biện pháp insurer dùng để kiểm soát:</b></p>
<ul><li><b>Underwriting:</b> sàng lọc, phân loại, từ chối hoặc chấp nhận có điều kiện</li>
<li><b>Risk classification / rating:</b> phí cao hơn cho nhóm rủi ro cao (tuổi, nghề nghiệp, tiền sử)</li>
<li><b>Khám sức khỏe, thẩm định, yêu cầu thông tin</b> khi nhận bảo hiểm</li>
<li><b>Deductibles, waiting periods, exclusions, giới hạn bồi thường</b></li>
<li><b>Utmost good faith:</b> buộc khai báo trung thực, có thể hủy hợp đồng nếu giấu thông tin trọng yếu</li></ul>
<h4>Insurance vs gambling: 2 khác biệt chính</h4>
<ul><li>Gambling <b>tạo ra rủi ro mới</b> (speculative). Insurance <b>chuyển rủi ro đã tồn tại</b> (pure risk).</li>
<li>Gambling <b>không có lợi ích xã hội</b> (một bên thắng, một bên thua). Insurance có lợi ích xã hội (giúp ổn định tài chính, bảo vệ người bị tổn thất). Đặc biệt, insured không có cơ hội lãi (indemnity chỉ đưa về vị trí cũ).</li></ul>
<h4>Insurance vs hedging: 2 khác biệt chính</h4>
<ul><li>Insurance thường áp dụng cho <b>pure risk</b>. Hedging dùng cho <b>speculative risk</b> (rủi ro giá: hàng hóa, tỷ giá, lãi suất).</li>
<li>Insurance có thể <b>giảm objective risk</b> nhờ pooling và law of large numbers. Hedging chỉ <b>chuyển rủi ro</b> sang bên khác, không giảm tổng rủi ro của hệ thống (người bên kia gánh).</li></ul>
<div class="tip">Câu hỏi so sánh trong đề thi: viết theo cấu trúc "Insurance ... whereas gambling/hedging ...", đủ hai ý, mỗi ý một câu.</div>` },

{ id: "c1-terms", title: "Key terms của chương 1 (tự kiểm tra nhanh)", html: `
<p>Các thuật ngữ cô liệt kê cuối chương. Mỗi từ nên nói được một câu định nghĩa. Bạn có thể kiểm tra bằng tab <b>Flashcard</b>.</p>
<p><b>Attitudinal (morale) hazard, Avoidance, Chance of loss, Direct loss, Enterprise risk, Diversifiable risk, Enterprise risk management, Financial risk, Hazard, Hedging, Hold-harmless clause, Human life value, Incorporation, Indirect (consequential) loss, Law of large numbers, Legal hazard, Liability risks, Loss exposure, Loss prevention, Non-diversifiable risk, Moral hazard, Noninsurance transfers, Objective probability, Objective risk, Peril, Personal risks, Physical hazard, Premature death, Property risks, Pure risk, Retention, Risk, Risk control, Risk financing, Self-insurance, Speculative risk, Subjective probability, Subjective risk.</b></p>
<div class="def"><b>Human life value:</b> giá trị hiện tại của thu nhập tương lai ròng (sau khi trừ chi tiêu cho bản thân) mà một người sẽ kiếm được. Dùng để ước lượng nhu cầu bảo hiểm nhân thọ.</div>
<div class="def"><b>Hold-harmless clause:</b> điều khoản hợp đồng trong đó một bên đồng ý chịu trách nhiệm cho tổn thất, miễn cho bên kia.</div>
<div class="def"><b>Self-insurance:</b> retention có kế hoạch, thường kèm quỹ dự phòng, có thể dự đoán tổn thất.</div>` }

sections: [
{ id: "c2-lln", title: "Law of large numbers", html: `
<ul><li><b>Probability</b> đo khả năng một sự kiện xảy ra, dựa trên tần suất dài hạn hoặc dữ liệu lịch sử.</li>
<li><b>Probability distribution</b> cho thấy các kết quả tổn thất có thể xảy ra và xác suất của chúng.</li>
<li><b>Expected loss (mean)</b> là tổn thất kỳ vọng. Mean cho biết tổn thất trung bình nhưng <b>không đo độ bất định</b>.</li>
<li><b>Variance và standard deviation</b> đo mức độ tổn thất phân tán quanh mean. Standard deviation <b>cao</b> thì bất định lớn, rủi ro cao. Standard deviation <b>thấp</b> thì tổn thất dễ dự đoán, rủi ro thấp.</li></ul>
<div class="def"><b>Law of large numbers:</b> khi số đơn vị được bảo hiểm tăng lên, tổn thất bình quân thực tế <b>tiến gần</b> tổn thất kỳ vọng.</div>
<ul><li>Danh mục lớn hơn thì tổn thất dễ dự đoán hơn.</li>
<li>Bảo hiểm thêm nhiều đơn vị làm <b>tổng tổn thất tiềm năng tăng</b>, nhưng <b>rủi ro không tăng tương ứng</b>.</li>
<li>Danh mục lớn <b>giảm objective risk</b>, tăng khả năng dự đoán.</li>
<li>Mối quan tâm chính của insurer là <b>độ lệch</b> giữa tổn thất thực tế và tổn thất kỳ vọng.</li></ul>` },

{ id: "c2-insurable", title: "Insurable risk: 6 điều kiện", html: `
<p>Insurer tư nhân thường chỉ bảo hiểm <b>pure risk</b>, và không phải pure risk nào cũng bảo hiểm tư được. Cần 6 điều kiện:</p>
<table><tr><th>#</th><th>Điều kiện</th><th>Ý nghĩa</th></tr>
<tr><td>1</td><td><b>Large number of exposure units</b></td><td>Cần nhiều đơn vị rủi ro để áp dụng law of large numbers</td></tr>
<tr><td>2</td><td><b>Accidental and unintentional loss</b></td><td>Tổn thất ngẫu nhiên, không cố ý (tránh moral hazard)</td></tr>
<tr><td>3</td><td><b>Determinable and measurable loss</b></td><td>Xác định được thời gian, nguyên nhân, số tiền</td></tr>
<tr><td>4</td><td><b>No catastrophic loss</b></td><td>Không đồng loạt xảy ra với phần lớn đơn vị cùng lúc</td></tr>
<tr><td>5</td><td><b>Calculable chance of loss</b></td><td>Ước tính được xác suất và mức độ tổn thất trung bình để định phí</td></tr>
<tr><td>6</td><td><b>Economically feasible premium</b></td><td>Phí phải thấp hơn nhiều so với tổn thất tiềm năng để người ta chịu mua</td></tr></table>
<div class="tip"><b>Mẹo nhớ nhóm:</b> Số lượng (1), Bản chất tổn thất (2, 3), Khả năng định giá và quản lý (4, 5, 6). Hoặc nhớ bằng câu: "Large, Accidental, Determinable, Not catastrophic, Calculable, Economical".</div>
<h4>Ví dụ: fire là insurable risk</h4>
<table><tr><th>Điều kiện</th><th>Đạt?</th><th>Lý do</th></tr>
<tr><td>1</td><td>Có</td><td>Có rất nhiều đơn vị rủi ro</td></tr>
<tr><td>2</td><td>Có</td><td>Trừ arson, hầu hết cháy là ngẫu nhiên, không cố ý</td></tr>
<tr><td>3</td><td>Có</td><td>Hợp đồng có điều khoản giải quyết tranh chấp về số tiền</td></tr>
<tr><td>4</td><td>Có</td><td>Có vụ cháy lớn, nhưng thường không đồng loạt</td></tr>
<tr><td>5</td><td>Có</td><td>Tính được xác suất cháy và mức tổn thất bình quân</td></tr>
<tr><td>6</td><td>Có</td><td>Phí trên mỗi $100 tương đối thấp</td></tr></table>
<h4>Ví dụ: unemployment không hoàn toàn là insurable risk</h4>
<table><tr><th>Điều kiện</th><th>Đạt?</th><th>Lý do</th></tr>
<tr><td>1</td><td>Không hoàn toàn</td><td>Nhiều người lao động, nhưng khó dự đoán do nhiều loại thất nghiệp, nhiều loại lao động</td></tr>
<tr><td>2</td><td>Không phải lúc nào cũng vậy</td><td>Một phần thất nghiệp do tự nguyện nghỉ việc</td></tr>
<tr><td>3</td><td>Không hoàn toàn</td><td>Đo được mức thất nghiệp nhưng khó đo tổn thất; có thất nghiệp tự nguyện</td></tr>
<tr><td>4</td><td><b>Không</b></td><td>Suy thoái quốc gia hoặc địa phương có thể gây tổn thất thảm khốc</td></tr>
<tr><td>5</td><td>Không hoàn toàn</td><td>Khó ước tính xác suất chính xác cho từng nghề</td></tr>
<tr><td>6</td><td>Không hoàn toàn</td><td>Adverse selection, moral hazard, tổn thất thảm khốc làm phí quá đắt</td></tr></table>` },

{ id: "c2-ugf", title: "Utmost good faith", html: `
<div class="def">Hợp đồng bảo hiểm dựa trên <b>utmost good faith</b>: mức độ trung thực cao hơn các hợp đồng thường áp dụng cho <b>cả hai bên</b>. Được hỗ trợ bởi 3 học thuyết pháp lý: <b>Representations, Concealment, Warranty</b>.</div>
<h4>1. Representation</h4>
<p>Là các tuyên bố của người đề nghị bảo hiểm (applicant). Hợp đồng <b>voidable</b> (có thể bị hủy bởi insurer) nếu representation:</p>
<ul><li><b>Material:</b> nếu insurer biết sự thật thì sẽ không phát hành hợp đồng, hoặc sẽ phát hành với điều kiện khác</li>
<li><b>False:</b> không đúng sự thật hoặc gây hiểu lầm</li>
<li><b>Reliance:</b> insurer dựa vào tuyên bố sai đó để phát hành hợp đồng với mức phí nhất định</li></ul>
<h4>2. Concealment</h4>
<ul><li>Là việc applicant <b>cố ý không tiết lộ</b> một sự kiện trọng yếu cho insurer (= nondisclosure).</li>
<li>Hiệu lực pháp lý giống misrepresentation: hợp đồng voidable theo lựa chọn của insurer.</li>
<li>Để từ chối bồi thường vì concealment, insurer (không phải marine) phải chứng minh <b>hai điều</b>: (1) insured biết sự việc bị che giấu là trọng yếu, (2) insured <b>có ý định lừa đảo</b> insurer.</li></ul>
<h4>3. Warranty</h4>
<p>Là tuyên bố trở thành <b>một phần của hợp đồng</b> và được người đưa ra <b>bảo đảm đúng ở mọi khía cạnh</b>.</p>
<div class="warn"><b>Phân biệt:</b> Misrepresentation = khai <b>sai</b> (nói điều không đúng). Concealment = <b>giấu</b> (cố ý không nói). Warranty = <b>cam kết</b> đã trở thành điều khoản hợp đồng.</div>
<h4>Nghĩa vụ khai báo: non-life vs life</h4>
<table><tr><th>Non-life</th><th>Life</th></tr>
<tr><td>Nghĩa vụ tồn tại <b>trong suốt thời hạn</b> hợp đồng. Khi <b>tái tục</b>, insured phải khai báo cả thay đổi mới phát sinh.</td>
<td>Chỉ cần thực hiện khi <b>insurer yêu cầu</b>. Hợp đồng dài hạn; insurer bị ràng buộc bởi hoàn cảnh đã tồn tại lúc ký.</td></tr></table>
<h4>Trách nhiệm của hai bên</h4>
<ul><li><b>Proposer/Insured:</b> khai đầy đủ, chính xác mọi thông tin trọng yếu mà mình biết hoặc có nghĩa vụ biết, <b>dù có được hỏi cụ thể hay không</b>.</li>
<li><b>Insurer:</b> khi tư vấn, chào bán phải cung cấp thông tin, giải thích điều khoản (phạm vi bảo hiểm và loại trừ), trả lời thắc mắc.</li></ul>
<h4>Chế tài (remedies)</h4>
<p>Chấm dứt/hủy hợp đồng (termination/voidance), điều chỉnh phí (premium adjustment), bảo hiểm có thêm điều kiện (additional conditions), từ chối chi trả (denial of claim), kiện tụng (litigation).</p>` },

{ id: "c2-ii", title: "Insurable interest", html: `
<div class="def"><b>Insurable interest:</b> người được bảo hiểm phải ở vị trí <b>chịu tổn thất tài chính</b> nếu sự kiện được bảo hiểm xảy ra. Ví dụ: có insurable interest với xe vì bị mất tiền nếu xe hư hoặc bị trộm.</div>
<h4>3 mục đích</h4>
<table><tr><th>Mục đích</th><th>Giải thích</th></tr>
<tr><td><b>Prevent gambling</b></td><td>Nếu không đòi hỏi, hợp đồng thành cờ bạc, trái lợi ích công cộng (mua bảo hiểm tài sản hay mạng sống người khác rồi mong có tổn thất)</td></tr>
<tr><td><b>Reduce moral hazard</b></td><td>Nếu insured chịu thiệt khi tổn thất xảy ra thì không có lợi khi cố ý gây ra</td></tr>
<tr><td><b>Measure the loss</b> (property)</td><td>Mức bồi thường bị giới hạn bởi insurable interest. Ví dụ sở hữu 60% tòa nhà: dù mua bảo hiểm 100%, tối đa chỉ nhận 60% giá trị</td></tr></table>
<h4>4 dạng insurable interest trong P&amp;C</h4>
<ol><li><b>Ownership of property</b> (chủ sở hữu tài sản)</li>
<li><b>Potential legal liability</b> (ví dụ tiệm giặt là có insurable interest với đồ của khách vì có thể phải bồi thường)</li>
<li><b>Secured creditors</b> (ngân hàng cho vay mua nhà có insurable interest vì nhà là tài sản thế chấp)</li>
<li><b>Contractual right</b> (công ty mua hàng nước ngoài, có quyền lợi hợp đồng với hàng hóa)</li></ol>
<h4>Trong life insurance</h4>
<ul><li>Mua bảo hiểm cho <b>chính mình</b> thì mặc nhiên thỏa mãn insurable interest.</li>
<li>Mua cho <b>người khác</b> thì phải có insurable interest với mạng sống của người đó.</li></ul>
<div class="warn"><b>Thời điểm phải tồn tại (hay ra đề):</b><br>• <b>Property insurance:</b> insurable interest phải có <b>tại thời điểm xảy ra tổn thất</b> (time of loss).<br>• <b>Life insurance:</b> chỉ cần có <b>lúc ký hợp đồng</b> (inception), không cần lúc chết.</div>
<p>Hệ quả: người đã bán nhà (Richard) không còn insurable interest dù còn hợp đồng bảo hiểm; chủ nợ chỉ có insurable interest đến mức dư nợ.</p>` },

{ id: "c2-ind", title: "Indemnity: nguyên tắc và ACV", html: `
<div class="def"><b>Principle of indemnity:</b> insurer đồng ý chi trả <b>không quá số tiền tổn thất thực tế</b>; insured không được lời từ tổn thất (should not profit from a loss). Phần lớn hợp đồng property và casualty là hợp đồng bồi thường.</div>
<p><b>Hai mục đích:</b> (1) ngăn insured kiếm lời từ tổn thất, (2) giảm moral hazard.</p>
<h4>Actual cash value (ACV)</h4>
<p>Phương pháp cơ bản để bồi thường property là theo ACV tại thời điểm tổn thất. Ba phương pháp tòa án dùng:</p>
<table><tr><th>Phương pháp</th><th>Nội dung</th></tr>
<tr><td><b>Replacement cost less depreciation</b></td><td>ACV = Replacement cost − Depreciation. Replacement cost là chi phí hiện hành để khôi phục tài sản bằng vật liệu mới cùng loại và chất lượng. Depreciation là khấu trừ do hao mòn vật lý, tuổi, lỗi thời kinh tế</td></tr>
<tr><td><b>Fair market value</b></td><td>Giá người mua tự nguyện trả cho người bán tự nguyện trong thị trường tự do. Có thể cao hoặc thấp hơn ACV tính theo RC trừ khấu hao (do vị trí, biến động kinh tế). Ví dụ slide: nhà có market value 7 tỷ VND, còn theo RC trừ khấu hao chỉ 4 tỷ</td></tr>
<tr><td><b>Broad evidence rule</b></td><td>Xét <b>mọi yếu tố liên quan</b> mà chuyên gia dùng: ACV, fair market value, giá trị hiện tại của thu nhập kỳ vọng từ tài sản, giá bán tài sản tương đương, ý kiến thẩm định viên</td></tr></table>
<div class="formula"><b>Ví dụ slide:</b> xe giá mới tương đương $80,000, dùng 5 năm, khấu hao 40%.<br>Depreciation = 80,000 × 40% = 32,000. ACV = 80,000 − 32,000 = <b>$48,000</b>.</div>
<div class="warn"><b>Bẫy hay gặp:</b> khấu hao áp dụng lên <b>replacement cost hiện tại</b>, không phải giá mua ban đầu. Ví dụ Ashley: mua $5,000, RC hiện tại $6,000, khấu hao 50% thì ACV = 6,000 × 50% = <b>$3,000</b> (không phải $2,500).</div>
<h4>Quy tắc bồi thường chung</h4>
<table><tr><th>Trường hợp</th><th>Số tiền bồi thường</th></tr>
<tr><td>Sum insured &gt; value at risk (overinsurance)</td><td>Actual loss (ACV của tổn thất)</td></tr>
<tr><td>Sum insured = value at risk</td><td>Actual loss</td></tr>
<tr><td>Sum insured &lt; value at risk (underinsurance), tổn thất toàn bộ</td><td>= Sum insured</td></tr>
<tr><td>Underinsurance, tổn thất một phần</td><td>Actual loss × (Sum insured / Value at risk)</td></tr></table>
<p>Nếu có deductible, policy limit hoặc điều kiện hợp đồng khác, số tiền chi trả thường nhỏ hơn actual loss.</p>` },

{ id: "c2-regimes", title: "Các chế độ bồi thường: deductible, average, first loss", html: `
<h4>Deductible</h4>
<p>Phần tổn thất, tới một mức xác định, <b>không được insurer chi trả</b> và insured phải tự chịu. <b>Mục đích:</b> loại bỏ các khiếu nại nhỏ; giảm phí; giảm moral hazard và attitudinal hazard.</p>
<table><tr><th>Loại</th><th>Cách hoạt động (ví dụ mức $20)</th></tr>
<tr><td><b>Straight deductible</b> (excess)</td><td>Loss ≤ $20: không trả. Loss &gt; $20: trả <b>Loss − $20</b></td></tr>
<tr><td><b>Franchise deductible</b></td><td>Loss ≤ $20: không trả. Loss &gt; $20: trả <b>đủ loss</b></td></tr>
<tr><td><b>Disappearing deductible</b></td><td>Biến thể của franchise: deductible <b>giảm dần</b> khi loss tăng, đến một mức loss thì bằng 0 (trả đủ)</td></tr>
<tr><td><b>Aggregate deductible</b></td><td>Cộng dồn mọi tổn thất trong kỳ (thường 1 năm) để đủ mức deductible. Khi đã đủ, insurer trả đủ các tổn thất sau đó</td></tr></table>
<p><b>Bảng ví dụ disappearing deductible (slide):</b></p>
<table><tr><th>Loss ($)</th><th>Deductible ($)</th><th>Payment ($)</th></tr>
<tr><td>500</td><td>500</td><td>0</td></tr><tr><td>1,000</td><td>450</td><td>550</td></tr><tr><td>2,000</td><td>350</td><td>1,650</td></tr><tr><td>5,000</td><td>5</td><td>4,995</td></tr><tr><td>6,000</td><td>0</td><td>6,000</td></tr></table>
<p><b>Ví dụ aggregate deductible $10,000 (slide):</b> claims 1,000 → 0; 2,000 → 0 (cộng dồn 3,000); 8,000 → 1,000 (cộng dồn 11,000, vượt 1,000); 1,000 → 1,000; 1,500 → 1,500.</p>
<h4>Average (pro-rata) indemnity</h4>
<div class="formula">Sum insured &lt; Value at risk (underinsurance):<br><b>Indemnity = Actual loss × (Sum insured / Value of goods at risk)</b></div>
<p>Insured tự gánh phần thiếu. <b>Mục đích:</b> ngăn việc cố tình bảo hiểm thiếu giá trị (moral hazard) để trả ít phí.</p>
<h4>First loss policy</h4>
<ul><li>Dùng khi người mua cảm thấy tổn thất tối đa từ một peril <b>không bao giờ vượt một phần nhỏ</b> giá trị rủi ro.</li>
<li>Khi có tổn thất, insurer trả <b>đến hết sum insured</b>, <b>không xét</b> tổng giá trị rủi ro (không áp dụng average).</li>
<li>Sum insured được cố ý giới hạn, thỏa thuận với insurer, thấp hơn toàn bộ giá trị (underinsurance có chủ ý).</li>
<li>Insurer thường tính <b>tỷ lệ phí cao hơn</b> bình thường (vì khả năng phải trả đủ cao hơn).</li></ul>` },

{ id: "c2-exc", title: "Ngoại lệ của nguyên tắc indemnity", html: `
<table><tr><th>Ngoại lệ</th><th>Nội dung</th></tr>
<tr><td><b>Valued policy</b></td><td>Hợp đồng trả <b>face amount</b> nếu xảy ra <b>total loss</b>. Dùng cho đồ cổ, tranh quý, đồ gia truyền vì khó xác định giá thị trường lúc tổn thất. Hai bên thống nhất giá trị ngay khi cấp hợp đồng.</td></tr>
<tr><td><b>Valued policy laws</b></td><td>Luật ở một số bang buộc trả <b>face amount</b> khi tổn thất toàn bộ real property do peril được nêu trong luật. Mục đích ban đầu: bảo vệ insured khỏi tranh chấp khi agent cố ý bảo hiểm quá giá trị để lấy hoa hồng cao hơn.</td></tr>
<tr><td><b>Replacement cost insurance</b></td><td>Không khấu trừ khấu hao khi bồi thường. Vì chi trả ACV vẫn có thể gây tổn thất đáng kể cho insured (ít người dự trù khấu hao).</td></tr>
<tr><td><b>Life insurance</b></td><td>Không phải hợp đồng bồi thường mà là valued policy: trả <b>số tiền đã định</b> cho người thụ hưởng khi insured chết.</td></tr></table>
<div class="warn"><b>Điểm hay ra đề:</b> Valued policy: tổn thất toàn bộ thì trả đủ <b>giá trị thỏa thuận</b>, bất kể giá thị trường lúc tổn thất cao hay thấp hơn. Nếu tổn thất bộ phận, thường vẫn bồi thường theo thiệt hại thực tế (không trả đủ face amount).</div>
<div class="tip"><b>Mẹo nhớ 4 ngoại lệ:</b> V - V - R - L (Valued policy, Valued policy laws, Replacement cost, Life).</div>` },

{ id: "c2-contr", title: "Contribution", html: `
<ul><li>Áp dụng khi có <b>double insurance</b>: cùng một tài sản được bảo hiểm bởi hai hoặc nhiều hợp đồng cùng lúc.</li>
<li>Cơ sở phân bổ: <b>rateable proportion</b> (theo tỷ lệ số tiền bảo hiểm).</li>
<li><b>Non-contribution clause:</b> hợp đồng không áp dụng với khiếu nại mà insured được bồi thường theo hợp đồng bảo hiểm khác.</li></ul>
<h4>5 điều kiện pháp lý</h4>
<ol><li>Có ít nhất <b>hai hợp đồng</b> bao phủ tổn thất</li>
<li>Cùng bảo hiểm <b>peril</b> gây ra tổn thất</li>
<li>Cùng bảo hiểm <b>insurable interest</b></li>
<li>Cùng <b>subject matter</b> (đối tượng bảo hiểm)</li>
<li>Mỗi insurer đều <b>có trách nhiệm</b> với tổn thất theo hợp đồng của mình</li></ol>
<div class="formula"><b>Công thức:</b> Bồi thường của mỗi insurer = Loss × (Sum insured của insurer đó / Tổng sum insured của tất cả hợp đồng)<br><br><b>Ví dụ slide:</b> Xe 800 triệu. Bảo Việt: STBH 800 triệu (01/01 đến 31/12/2024). PVI: STBH 700 triệu (01/03/2024 đến 29/02/2025). Giai đoạn 01/03 đến 31/12/2024 là double insurance. Tổn thất 30/06/2024 là 100 triệu.<br>BV = 100 × 800/1,500 = 53.33 triệu; PVI = 100 × 700/1,500 = 46.67 triệu. Tổng = 100 triệu.</div>
<div class="warn"><b>Chú ý:</b> Tổng bồi thường không bao giờ vượt tổn thất thực tế. Phải kiểm tra ngày tổn thất có nằm trong giai đoạn <b>cả hai hợp đồng cùng hiệu lực</b> hay không. Nếu chỉ một hợp đồng có hiệu lực thì không có contribution.</div>` },

{ id: "c2-subro", title: "Subrogation", html: `
<div class="def"><b>Subrogation:</b> insurer <b>thế quyền</b> insured để đòi bồi thường từ bên thứ ba có lỗi, với tổn thất đã được bảo hiểm chi trả. Hay: insurer được quyền thu hồi từ bên thứ ba có lỗi mọi khoản đã chi trả cho insured. Subrogation <b>hỗ trợ mạnh</b> nguyên tắc indemnity.</div>
<p><b>Ví dụ slide:</b> Xe A bị xe B (có lỗi 100%) đâm, thiệt hại 10 triệu. A mua bảo hiểm Bảo Việt, được bồi thường 10 triệu. Bảo Việt có quyền pháp lý đòi 10 triệu từ xe B.</p>
<h4>Vì sao cần subrogation (3 lợi ích)</h4>
<ul><li>Ngăn insured <b>nhận bồi thường hai lần</b> cho cùng một tổn thất</li>
<li><b>Buộc người có lỗi chịu trách nhiệm</b></li>
<li>Giúp <b>giữ phí bảo hiểm ở mức thấp</b></li></ul>
<h4>Bốn điểm cần nhớ</h4>
<ol><li>Insurer chỉ được đòi <b>tối đa số tiền đã chi trả</b>.</li>
<li>Sau tổn thất, insured <b>không được làm tổn hại</b> quyền subrogation của insurer (ví dụ ký miễn trách nhiệm cho người gây ra).</li>
<li>Subrogation <b>không áp dụng với life insurance</b> (không phải hợp đồng bồi thường).</li>
<li>Insurer <b>không được subrogate chống lại chính insured</b> của mình.</li></ol>
<div class="warn"><b>Phân biệt:</b> Contribution = giữa các <b>insurer</b> với nhau (nhiều hợp đồng). Subrogation = insurer đòi <b>bên thứ ba có lỗi</b>.</div>` },

{ id: "c2-prox", title: "Proximate cause", html: `
<div class="def"><b>Proximate cause:</b> nguyên nhân <b>chủ động, hiệu quả</b> khởi động một chuỗi sự kiện dẫn đến kết quả, mà không có lực nào khác bắt đầu hoạt động từ một nguồn mới và độc lập xen vào.</div>
<ul><li>Không nhất thiết là nguyên nhân <b>đầu tiên hay cuối cùng</b> trong chuỗi, mà là nguyên nhân <b>chi phối, kiểm soát</b> (dominant).</li>
<li>Có <b>liên kết trực tiếp</b> giữa nguyên nhân và kết quả: ở mỗi giai đoạn, sự kiện tiếp theo có thể dự đoán một cách logic.</li></ul>
<table><tr><th>Ví dụ</th><th>Kết luận</th></tr>
<tr><td><b>Covered:</b> bão (covered peril) làm đổ cây vào xe, thủng bình xăng, gây cháy</td><td>Bão là proximate cause, <b>toàn bộ tổn thất được bồi thường</b></td></tr>
<tr><td><b>Excluded:</b> lũ lớn (excluded peril theo hợp đồng chuẩn) gây chập điện dẫn đến cháy</td><td>Proximate cause là lũ, <b>insurer có thể từ chối</b></td></tr></table>
<div class="tip"><b>Cách làm bài:</b> viết chuỗi sự kiện, tìm nguyên nhân chi phối, kiểm tra nguyên nhân đó thuộc covered hay excluded peril, rồi kết luận.</div>` },

{ id: "c2-sum", title: "Bảng tổng hợp 8 nguyên tắc", html: `
<table><tr><th>Nguyên tắc</th><th>Một câu</th><th>Áp dụng</th></tr>
<tr><td>Law of large numbers</td><td>Nhiều đơn vị thì tổn thất thực tế gần kỳ vọng</td><td>Định phí, dự báo</td></tr>
<tr><td>Insurable risk</td><td>6 điều kiện để một rủi ro bảo hiểm được</td><td>Fire (đạt), unemployment (không hoàn toàn)</td></tr>
<tr><td>Utmost good faith</td><td>Trung thực tuyệt đối, 3 học thuyết</td><td>Giấu nhà hàng trong tòa nhà: concealment</td></tr>
<tr><td>Insurable interest</td><td>Phải bị thiệt tài chính khi xảy ra tổn thất</td><td>Property: lúc tổn thất. Life: lúc ký</td></tr>
<tr><td>Indemnity</td><td>Không được lời từ tổn thất</td><td>ACV, deductible, average</td></tr>
<tr><td>Contribution</td><td>Chia tổn thất giữa các insurer theo tỷ lệ</td><td>Double insurance</td></tr>
<tr><td>Subrogation</td><td>Insurer thế quyền đòi bên có lỗi</td><td>Va chạm xe, thợ điện lắp sai</td></tr>
<tr><td>Proximate cause</td><td>Nguyên nhân chi phối quyết định bồi thường</td><td>Bão gây cháy: covered</td></tr></table>` }

sections: [
{ id: "c4-over", title: "Tổng quan: private và social insurance", html: `
<h4>Rủi ro doanh nghiệp có thể gặp và giải pháp bảo hiểm</h4>
<table><tr><th>Nhóm rủi ro</th><th>Ví dụ</th></tr>
<tr><td><b>Personal accident and health risks</b></td><td>Tai nạn lao động, ốm đau/tử vong</td></tr>
<tr><td><b>Property risks</b></td><td>Hư hỏng/phá hủy ngẫu nhiên, trộm cắp, cháy nổ</td></tr>
<tr><td><b>Liability risks</b></td><td>Trách nhiệm dân sự bồi thường cho bên thứ ba/khách hàng</td></tr></table>
<p><b>Private insurance solutions:</b> auto, cargo, fire and explosion, property, product liability, motor vehicle owner's liability, accident, private health, life insurance cho nhân viên.<br><b>Social insurance solutions:</b> hệ thống bảo hiểm xã hội, bảo hiểm y tế xã hội, bảo hiểm thất nghiệp cho người lao động.</p>
<h4>Phân loại theo targeted market (ai mua, ai được bảo vệ)</h4>
<table><tr><th></th><th>Personal</th><th>Group</th><th>Business</th></tr>
<tr><td><b>Coverage</b></td><td>Life, health, disability, auto, homeowner, long-term care</td><td>Life, disability, health, pension plans</td><td>Property and casualty cho doanh nghiệp</td></tr>
<tr><td><b>Risk pool</b></td><td>Cá nhân và gia đình</td><td>Nhóm người lao động</td><td>Doanh nghiệp và tổ chức</td></tr>
<tr><td><b>Underwriting focus</b></td><td>Yếu tố rủi ro của từng cá nhân</td><td>Nhân khẩu học và kinh nghiệm của nhóm</td><td>Thẩm định chuyên biệt cho rủi ro tổ chức</td></tr></table>
<h4>Private vs government insurance</h4>
<table><tr><th>Private insurance</th><th>Government insurance</th></tr>
<tr><td>Do insurer tư nhân cung cấp. Cung cấp <b>hầu hết P&amp;C</b>. Có thể bán personal insurance <b>bổ sung</b>. Đem lại bảo vệ <b>vượt trên</b> mức bảo vệ xã hội cơ bản.</td>
<td>Do cơ quan liên bang và bang cung cấp. Cung cấp personal insurance quy mô lớn qua <b>social insurance system</b>. Bảo vệ cơ bản: chết, ốm, nghỉ hưu, thất nghiệp. Quyền lợi chọn lọc theo <b>cơ sở bắt buộc (involuntary)</b>.</td></tr></table>
<div class="tip"><b>Key idea:</b> Government insurance = bảo vệ xã hội <b>cơ bản</b>; private insurance = bảo vệ <b>bổ sung</b>.</div>
<h4>Hai nhóm sản phẩm cốt lõi của private insurance</h4>
<table><tr><th>Category</th><th>Đối tượng được bảo vệ</th><th>Phạm vi chính</th></tr>
<tr><td><b>Life / Health</b></td><td>Giá trị cuộc sống con người, sức khỏe, thu nhập tương lai (human life value)</td><td>Death benefit (term life, whole life); chi phí y tế; disability income (thay thế lương); long-term care và hưu trí</td></tr>
<tr><td><b>Property &amp; Casualty</b></td><td><b>Property:</b> real property (nhà), personal property (xe, hàng hóa). <b>Casualty:</b> nghĩa vụ pháp lý với bên thứ ba và tài sản hoạt động kinh doanh</td><td>Direct property damage (cháy, bão, trộm); indirect loss (mất thu nhập kinh doanh, chi phí hoạt động liên tục khi ngừng); chi phí bào chữa và bồi thường theo tòa khi gây thương tích/hư hại cho người khác</td></tr></table>` },

{ id: "c4-ops", title: "6 nghiệp vụ của insurer tư nhân", html: `
<p>Sáu chức năng (operations): <b>Rate making, Underwriting, Production, Claim settlement, Reinsurance, Investment</b>.</p>
<div class="tip"><b>Mẹo nhớ theo vòng đời hợp đồng:</b> Định giá (Rate making) → Bán (Production) → Chọn lọc (Underwriting) → Bồi thường (Claim settlement) → Chia sẻ rủi ro (Reinsurance) → Đầu tư quỹ (Investment).</div>` },

{ id: "c4-rate", title: "Rate making", html: `
<div class="def"><b>Rate making:</b> định giá bảo hiểm và tính premiums. Tổng phí thu phải đủ trả mọi bồi thường và chi phí trong kỳ hợp đồng. <b>Actuary</b> xác định phí dựa trên kinh nghiệm tổn thất của công ty và thống kê ngành.</div>
<h4>4 đặc điểm riêng của định giá bảo hiểm</h4>
<table><tr><th>#</th><th>Đặc điểm</th><th>Nội dung</th></tr>
<tr><td>1</td><td><b>Inverted production cycle</b></td><td>Sản phẩm thông thường biết giá vốn trước khi bán. Bảo hiểm được định giá trước mà không biết chi phí bồi thường tương lai</td></tr>
<tr><td>2</td><td><b>Premium inadequacy exposure</b></td><td>Phí thu trước có thể không đủ trả bồi thường và chi phí do tần suất/mức độ tổn thất bất ngờ</td></tr>
<tr><td>3</td><td><b>Ex-post cost determination</b> (lagged cost realization)</td><td>Chỉ biết tổng chi phí thực sau khi thời hạn bảo hiểm kết thúc và mọi khiếu nại đã giải quyết</td></tr>
<tr><td>4</td><td><b>Total profitability objective</b></td><td>Lợi nhuận mục tiêu dựa vào <b>phí bảo hiểm + thu nhập đầu tư (float)</b> phải vượt tổng bồi thường và chi phí</td></tr></table>` },

{ id: "c4-uw", title: "Underwriting", html: `
<div class="def"><b>Underwriting:</b> quá trình <b>lựa chọn, phân loại và định giá</b> người đề nghị bảo hiểm. Chính sách underwriting do ban quản lý cấp cao phụ trách underwriting xác định (statement of underwriting policy).</div>
<h4>Underwriting policy</h4>
<ul><li><b>Business selection:</b> chọn loại hình kinh doanh theo lợi nhuận: lợi nhuận thấp nhưng khối lượng lớn, hoặc lợi nhuận cao nhưng khối lượng nhỏ.</li>
<li><b>Business classification:</b> <b>acceptable, borderline, prohibited</b>.</li>
<li><b>Insurance limits:</b> mức bảo hiểm tối đa được phát hành cho business acceptable và borderline.</li></ul>
<p><b>Policy phải nêu rõ:</b> các line of insurance sẽ bán; lãnh thổ mục tiêu; mẫu hợp đồng và bảng tính phí (forms, rating plans); loại business acceptable/borderline/prohibited; số tiền bảo hiểm cho phép; business cần senior underwriter duyệt.</p>
<h4>3 underwriting principles</h4>
<table><tr><th>#</th><th>Nguyên tắc</th><th>Nội dung</th></tr>
<tr><td>1</td><td><b>Attain an underwriting profit</b></td><td>Chọn một số loại applicant, từ chối loại khác để có danh mục sinh lời. Tổng phí thu &gt; tổng bồi thường + chi phí, bảo đảm khả năng thanh toán và lợi nhuận đầu tư bền vững</td></tr>
<tr><td>2</td><td><b>Select prospective insureds according to company standards</b></td><td>Chỉ chọn những insured có kinh nghiệm tổn thất không vượt giả định trong cấu trúc phí. Mục đích tiêu chuẩn: <b>giảm adverse selection</b></td></tr>
<tr><td>3</td><td><b>Provide equity among policyholders</b></td><td>Tính phí công bằng; mỗi nhóm phải tự chi trả tổn thất và chi phí của mình</td></tr></table>
<h4>Ba quyết định underwriting</h4>
<ol><li>Accept the application</li><li>Accept <b>subject to restrictions or modifications</b></li><li>Reject the application</li></ol>
<h4>Các nguồn thông tin của underwriter (câu cô hỏi)</h4>
<p>Slide hỏi nhưng không liệt kê; theo giáo trình Rejda các nguồn chính gồm:</p>
<ul><li>Đơn yêu cầu bảo hiểm (<b>application</b>)</li><li>Báo cáo của <b>agent</b></li><li>Báo cáo kiểm tra/điều tra (<b>inspection or investigation report</b>), kiểm tra hiện trường</li><li>Thông tin y tế (khám sức khỏe, hồ sơ bệnh án; cho life/health)</li><li>Hồ sơ tín dụng, hồ sơ lái xe, lịch sử bồi thường (<b>prior loss experience</b>)</li></ul>
<h4>Other underwriting considerations</h4>
<ul><li><b>Rate adequacy and underwriting:</b> phí phải đủ cho rủi ro nhận vào</li><li><b>Reinsurance and underwriting:</b> khả năng tái bảo hiểm ảnh hưởng đến hạn mức nhận</li><li><b>Renewal underwriting:</b> đánh giá lại khi tái tục</li></ul>
<h4>Credit scoring trong underwriting (câu thảo luận)</h4>
<ul><li><b>Vì sao dùng:</b> điểm tín dụng thường tương quan với tần suất/mức độ bồi thường; khách quan, rẻ, nhanh, giúp phân loại rủi ro và định giá chính xác hơn.</li>
<li><b>Có thể đánh giá sai:</b> người ít lịch sử tín dụng (trẻ, mới nhập cư), người gặp khó khăn tài chính do ốm đau, thất nghiệp mà vẫn lái xe an toàn, sai sót trong báo cáo tín dụng, thiên lệch với nhóm thu nhập thấp.</li>
<li><b>Tiêu chí thay thế:</b> hồ sơ lái xe, lịch sử bồi thường, số km chạy hàng năm, loại xe, telematics (bảo hiểm theo hành vi lái), khóa học lái xe an toàn.</li></ul>
<p><b>Chứng chỉ underwriting:</b> CPCU (Chartered Property and Casualty Underwriter), Associate in Commercial Underwriting, LUTCF (NAIFA), CLU (American College), Certificate in Underwriting (LOMA).</p>` },

{ id: "c4-prod", title: "Production và claim settlement", html: `
<h4>Production</h4>
<p>Là hoạt động <b>bán hàng và marketing</b> của insurer. Agent thường gọi là <b>producer</b>. Life insurer có <b>sales department</b>; P&amp;C insurer có <b>marketing department</b>.</p>
<h4>Claim settlement: quy trình</h4>
<ol><li>Bắt đầu với <b>notice of loss</b></li><li>Claim được <b>điều tra</b></li><li><b>Claims adjuster</b> xác định có tổn thất được bảo hiểm không và số tiền tổn thất</li><li>Adjuster có thể yêu cầu <b>proof of loss</b> trước khi chi trả</li><li>Quyết định <b>trả hay từ chối</b></li><li>Hợp đồng có điều khoản giải quyết tranh chấp</li></ol>
<h4>Mục tiêu giải quyết bồi thường</h4>
<table><tr><th>Mục tiêu</th><th>Nội dung</th></tr>
<tr><td><b>Verification of a covered loss</b></td><td>Xác định người hoặc tài sản có nằm trong hợp đồng và mức độ bảo hiểm</td></tr>
<tr><td><b>Fair and prompt payment</b></td><td>Tránh chi trả quá mức; chống gian lận (vì cuối cùng làm tăng phí). Cấm các hành vi không công bằng theo luật NAIC: từ chối trả mà không điều tra hợp lý; không cố gắng giải quyết nhanh, công bằng khi trách nhiệm đã rõ; ép insured kiện bằng cách đề nghị thấp hơn nhiều (<b>lowballing</b>)</td></tr>
<tr><td><b>Personal assistance to the insured</b></td><td>Hỗ trợ cá nhân sau tổn thất, ngoài nghĩa vụ hợp đồng</td></tr></table>
<h4>Lowballing (câu hỏi cô đặt)</h4>
<ul><li><b>Lowballing:</b> insurer đề nghị bồi thường <b>thấp hơn đáng kể</b> số tiền thực sự phải trả, buộc insured chấp nhận hoặc phải kiện mới nhận đủ.</li>
<li><b>Vì sao insurer làm:</b> giảm chi phí bồi thường; kỳ vọng insured thiếu hiểu biết hoặc cần tiền gấp nên chấp nhận; nhiều insured không muốn tốn thời gian, chi phí kiện tụng.</li></ul>
<h4>4 loại claims adjuster</h4>
<table><tr><th>Loại</th><th>Đặc điểm</th></tr>
<tr><td><b>Agent</b></td><td>Có thẩm quyền giải quyết các <b>first-party claims nhỏ</b> đến một giới hạn. Ưu điểm: nhanh, giảm chi phí điều chỉnh, giữ thiện chí của policyholder</td></tr>
<tr><td><b>Company adjuster</b></td><td>Nhân viên hưởng lương, <b>chỉ đại diện một công ty</b>. Điều tra, xác định tổn thất, sắp xếp chi trả</td></tr>
<tr><td><b>Independent adjuster</b></td><td>Tổ chức/cá nhân điều chỉnh bồi thường <b>lấy phí</b>. P&amp;C insurer thường thuê khi xảy ra tổn thất thảm họa trong khu vực</td></tr>
<tr><td><b>Public adjuster</b></td><td>Đại diện cho <b>insured</b> (không phải insurer), trả phí theo <b>tỷ lệ số tiền bồi thường</b></td></tr></table>` },

{ id: "c4-re", title: "Reinsurance", html: `
<div class="def"><b>Reinsurance:</b> thỏa thuận trong đó <b>primary insurer</b> (người ký hợp đồng ban đầu) chuyển một phần hoặc toàn bộ tổn thất tiềm năng cho insurer khác.</div>
<table><tr><th>Thuật ngữ</th><th>Nghĩa</th></tr>
<tr><td><b>Ceding company</b></td><td>Primary insurer chuyển bớt rủi ro đi</td></tr>
<tr><td><b>Reinsurer</b></td><td>Insurer nhận phần rủi ro chuyển sang</td></tr>
<tr><td><b>Retention limit</b></td><td>Mức bảo hiểm ceding company giữ lại cho mình (với mỗi hợp đồng hay mỗi sự kiện tổn thất)</td></tr>
<tr><td><b>Cession</b></td><td>Số tiền bảo hiểm chuyển cho reinsurer</td></tr></table>
<h4>4 lý do dùng reinsurance</h4>
<ol><li><b>Increase underwriting capacity:</b> cho phép phát hành một hợp đồng vượt quá retention limit với toàn bộ số tiền bảo hiểm</li>
<li><b>Stabilize profits:</b> tổn thất lớn bất ngờ được chuyển một phần cho reinsurer, kết quả tài chính ổn định hơn</li>
<li><b>Provide protection against catastrophic loss:</b> reinsurer trả một phần hoặc toàn bộ phần tổn thất vượt retention, tới giới hạn tối đa</li>
<li><b>Reduce the unearned premium reserve:</b> giảm dự phòng phí chưa thu theo luật, tạm thời tăng surplus, cải thiện tỷ lệ surplus/net written premiums, cho phép tiếp tục tăng trưởng</li></ol>
<h4>Facultative vs Treaty (nghĩa vụ chuyển nhượng)</h4>
<table><tr><th>Tiêu chí</th><th>Facultative</th><th>Treaty</th></tr>
<tr><td>Phạm vi</td><td>Từng rủi ro riêng lẻ (case-by-case)</td><td>Toàn bộ danh mục hợp đồng đủ điều kiện</td></tr>
<tr><td>Nghĩa vụ chuyển (cession)</td><td><b>Tùy chọn</b> của primary insurer</td><td><b>Bắt buộc</b> với mọi business đủ điều kiện</td></tr>
<tr><td>Nghĩa vụ chấp nhận</td><td>Reinsurer <b>tùy quyền</b> chấp nhận</td><td>Reinsurer <b>bị ràng buộc</b> chấp nhận tự động</td></tr>
<tr><td>Tốc độ phát hành hợp đồng</td><td>Chậm: phải đợi xếp xong reinsurance</td><td>Ngay lập tức</td></tr>
<tr><td>Giá trị chiến lược</td><td>Phù hợp rủi ro lớn, giá trị cao</td><td>Quy mô, tiết kiệm hành chính</td></tr></table>
<p><b>Facultative:</b> ưu điểm: linh hoạt, mở rộng năng lực, đệm biến động. Nhược điểm: không chắc reinsurer chấp nhận, chậm phát hành, giá cao khi thị trường thắt chặt. <b>Ví dụ slide:</b> nhà máy lọc dầu $200M, retention $20M, phải xếp facultative reinsurance trước khi phát hành hợp đồng.</p>
<p><b>Treaty:</b> ưu điểm cho primary insurer: ràng buộc tự động, phát hành ngay, tiết kiệm đàm phán. Rủi ro của reinsurer: phụ thuộc chất lượng underwriting của primary (<b>blind reliance</b>), adverse selection, phí chưa đủ. Kỷ luật thị trường: nếu primary liên tục chuyển business xấu, reinsurer sẽ rút lui.</p>
<p><b>FacOb (facultative obligatory):</b> dạng trung gian: insurer có quyền chuyển hay không, nhưng reinsurer phải chấp nhận mọi business được chuyển theo điều kiện định trước.</p>
<h4>Technical types: proportional vs non-proportional</h4>
<table><tr><th></th><th>Proportional</th><th>Non-proportional</th></tr>
<tr><td>Nội dung</td><td>Reinsurer gánh một <b>tỷ lệ cố định</b> tổn thất, nhận <b>tỷ lệ cố định</b> phí gốc</td><td>Reinsurer trả mọi tổn thất <b>vượt một mức định trước</b>, đổi lại phí cố định (không theo tỷ lệ)</td></tr>
<tr><td>Ví dụ</td><td><b>70/30 Quota Share</b></td><td><b>$2M excess of $1M</b></td></tr>
<tr><td>Claim nhỏ</td><td>$100k: ceding $70k, reinsurer $30k</td><td>$600k: ceding $600k, reinsurer $0</td></tr>
<tr><td>Claim lớn</td><td>$10M: ceding $7M, reinsurer $3M</td><td>$3M: ceding $1M (retention), reinsurer $2M</td></tr></table>
<div class="formula"><b>Quota share:</b> Ceding trả = Loss × % giữ lại; Reinsurer = Loss × % nhượng.<br><b>Excess of loss (XL) $A xs $R:</b> Reinsurer = min(max(Loss − R, 0), A); Ceding = Loss − Reinsurer.</div>` },

{ id: "c4-inv", title: "Investment", html: `
<ul><li>Vì phí được đóng <b>trước</b>, insurer có thể đầu tư cho đến khi cần chi trả bồi thường và chi phí.</li>
<li>Thu nhập đầu tư <b>rất quan trọng</b> để giảm phí và bù đắp kết quả underwriting bất lợi.</li>
<li><b>Life insurance</b> là hợp đồng <b>dài hạn</b> nên công ty life thường đầu tư vào tài sản <b>dài hạn</b>.</li>
<li><b>Non-life insurance</b> là hợp đồng <b>ngắn hạn</b> nên công ty non-life thường đầu tư tài sản <b>ngắn hạn</b>.</li></ul>` },

{ id: "c4-reg", title: "Regulation: lý do và phạm vi", html: `
<h4>5 lý do cần quản lý bảo hiểm tư nhân</h4>
<table><tr><th>Lý do</th><th>Giải thích</th></tr>
<tr><td><b>Maintain insurer solvency</b></td><td>Phí đóng trước nhưng bảo vệ kéo dài vào tương lai. Insurer phá sản thì khiếu nại tương lai không được trả. Chi phí xã hội: mất việc, giảm thuế phí bảo hiểm nộp cho bang. Cần giám sát sức mạnh tài chính</td></tr>
<tr><td><b>Compensate for inadequate consumer knowledge</b></td><td>Đa số người tiêu dùng thiếu thông tin để so sánh giá trị hợp đồng. Quản lý tạo hiệu ứng thị trường giống như người tiêu dùng am hiểu trong thị trường cạnh tranh</td></tr>
<tr><td><b>Ensure reasonable rates</b></td><td>Phí không quá cao (bị tính giá cắt cổ) cũng không quá thấp (đe dọa solvency). Bảo vệ trước việc tăng phí cao sau thảm họa để bù lỗ</td></tr>
<tr><td><b>Make insurance available</b></td><td>Insurer thường không muốn bảo hiểm mọi người vì lý do tài chính; lợi ích công có thể đòi hỏi mở rộng thị trường</td></tr></table>
<div class="warn"><b>Chú ý:</b> slide trình bày <b>4 lý do chính</b> ở trên (solvency, consumer knowledge, reasonable rates, availability). Nếu đề hỏi "5 reasons", hãy hỏi lại cô hoặc bổ sung "protect consumers from unfair practices" như ý mở rộng.</div>
<h4>Các lĩnh vực được quản lý</h4>
<p>Thành lập và cấp phép insurer (formation and licensing); solvency; rate regulation; policy forms; sales practices và bảo vệ người tiêu dùng; thuế đối với insurer.</p>` },

{ id: "c4-prod2", title: "Cây sản phẩm bảo hiểm tư nhân", html: `
<p>Private insurance gồm 3 nhánh lớn: <b>Private health insurance, Non-life insurance, Life insurance</b>.</p>
<table><tr><th>Nhánh</th><th>Sản phẩm</th></tr>
<tr><td><b>Private health insurance</b></td><td><b>Personal accident</b> (student accident, 24/7 personal accident, travel insurance); <b>Critical illness</b>; <b>Disability income</b>; <b>Medical expense</b> (medical expense reimbursement); <b>Others</b> (comprehensive health insurance: accident, medical expenses...)</td></tr>
<tr><td><b>Non-life insurance</b></td><td>Property, Engineering, Marine, Cyber, Agricultural, Energy, Others</td></tr>
<tr><td><b>Life insurance</b></td><td><b>Death benefit insurance:</b> term life insurance, permanent life insurance (traditional whole life, universal life). <b>Survival benefit:</b> endowment insurance. <b>Investment-linked life insurance:</b> unit-linked insurance</td></tr></table>` },

{ id: "c4-soc", title: "Social insurance", html: `
<div class="def"><b>Social insurance:</b> bảo đảm thay thế hoặc bù đắp một phần thu nhập của người tham gia bị giảm hoặc mất do <b>sickness, maternity, occupational accident, occupational disease, retirement hoặc death</b>, dựa trên đóng góp vào quỹ BHXH hoặc phân bổ ngân sách nhà nước.</div>
<h4>Vì sao có social insurance</h4>
<ul><li>Được ban hành để giải quyết các vấn đề xã hội phức tạp.</li><li>Một số rủi ro khó bảo hiểm tư nhân.</li><li>Tạo nền tảng an ninh kinh tế cho dân cư.</li></ul>
<h4>Đặc điểm cơ bản (8 ý)</h4>
<table><tr><th>Đặc điểm</th><th>Ý nghĩa</th></tr>
<tr><td><b>Compulsory programs</b></td><td>Bắt buộc</td></tr>
<tr><td><b>Floor of income</b></td><td>Đảm bảo mức thu nhập sàn</td></tr>
<tr><td><b>Emphasis on social adequacy rather than individual equity</b></td><td>Chú trọng đủ sống cho xã hội hơn là công bằng cá nhân (đóng nhiều không nhất thiết hưởng đúng tỷ lệ)</td></tr>
<tr><td><b>Benefits loosely related to earnings</b></td><td>Quyền lợi liên hệ lỏng với thu nhập</td></tr>
<tr><td><b>Benefits prescribed by law</b></td><td>Quyền lợi do luật quy định</td></tr>
<tr><td><b>No means test</b></td><td>Không kiểm tra thu nhập/tài sản khi hưởng</td></tr>
<tr><td><b>Full funding unnecessary</b></td><td>Không cần tích lũy đầy đủ (thường pay-as-you-go một phần)</td></tr>
<tr><td><b>Financially self-supporting</b></td><td>Tự cân đối tài chính qua đóng góp</td></tr></table>
<h4>Đối tượng, phạm vi, mức hưởng</h4>
<ul><li><b>Participants:</b> người sử dụng lao động và người lao động. Tùy trình độ phát triển, có thể bao phủ toàn bộ lực lượng lao động hoặc một số nhóm nhất định.</li>
<li><b>Object:</b> thu nhập của người lao động bị giảm hoặc mất do suy giảm/mất khả năng lao động hoặc mất việc.</li>
<li><b>Scope:</b> bảo vệ trước mất hoặc giảm thu nhập do tai nạn lao động, tuổi già và các sự kiện khác của cuộc sống, thường gắn với việc làm.</li>
<li><b>Yếu tố ảnh hưởng mức hưởng:</b> mức độ suy giảm khả năng lao động; thu nhập trước khi nghỉ hưu; nghề nghiệp và thời gian làm việc; tuổi thọ trung bình; điều kiện kinh tế xã hội từng thời kỳ.</li>
<li><b>Nguyên tắc mức hưởng:</b> thấp hơn thu nhập trước nghỉ hưu để khuyến khích quay lại làm việc khi có thể, nhưng mức tối thiểu vẫn đủ đảm bảo mức sống tối thiểu cho người lao động và gia đình.</li></ul>
<h4>Luật BHXH</h4>
<ul><li>Tổ chức bộ máy thực hiện BHXH.</li><li>Quản lý thu, chi, bảo toàn, tăng trưởng và cân đối quỹ BHXH.</li><li>Giải quyết khiếu nại, tố cáo và xử lý vi phạm pháp luật về BHXH.</li></ul>
<h4>9 branches theo ILO</h4>
<ol><li>Health protection (medical care)</li><li>Sickness benefits (earnings replacement)</li><li>Unemployment benefits</li><li>Old-age pensions</li><li>Employment injury benefits</li><li>Family and child benefits</li><li>Maternity benefits</li><li>Disability benefits</li><li>Survivors' benefits</li></ol>
<div class="tip"><b>Mẹo nhớ 9 branches:</b> Health, Sick, Unemployed, Old, Injury, Family, Maternity, Disability, Survivors (H-S-U-O-I-F-M-D-S).</div>` },

{ id: "c4-cmp", title: "Private vs Social insurance", html: `
<table><tr><th>Tiêu chí</th><th>Private insurance</th><th>Social insurance</th></tr>
<tr><td>Tính chất</td><td>Tự nguyện (voluntary), thỏa thuận hợp đồng</td><td>Bắt buộc (compulsory), do luật quy định</td></tr>
<tr><td>Mục tiêu</td><td>Bảo vệ bổ sung, lợi nhuận</td><td>Bảo vệ cơ bản, an sinh xã hội</td></tr>
<tr><td>Nguyên tắc</td><td><b>Individual equity</b>: đóng theo rủi ro, hưởng theo hợp đồng</td><td><b>Social adequacy</b>: đủ sống, không kiểm tra thu nhập</td></tr>
<tr><td>Quyền lợi</td><td>Theo hợp đồng và phí đóng</td><td>Theo luật, liên hệ lỏng với thu nhập</td></tr>
<tr><td>Đơn vị cung cấp</td><td>Insurer tư nhân</td><td>Cơ quan chính phủ</td></tr>
<tr><td>Rủi ro phù hợp</td><td>Insurable risks (6 điều kiện)</td><td>Rủi ro khó bảo hiểm tư (ví dụ thất nghiệp)</td></tr></table>
<p>Hai dòng cuối ("voluntary", "mục tiêu", "rủi ro phù hợp") tổng hợp từ ý slide để so sánh; khi viết bài thi hãy bám các từ khóa slide: <i>compulsory, floor of income, social adequacy, benefits prescribed by law, no means test</i>.</p>` }
]});

window.CARDS = [

["c1","Objective risk","Độ biến thiên tương đối của tổn thất thực tế so với tổn thất kỳ vọng (degree of risk). Giảm khi số đơn vị rủi ro tăng."],

["c1","Tangible vs intangible hazard","Tangible = physical hazard. Intangible = moral, morale, legal hazard."],

["c1","Speculative risk","Có thể lãi hoặc lỗ (đầu tư, cờ bạc)."],

["c1","3 nhóm rủi ro của cá nhân và gia đình","Personal risks (chết sớm, thu nhập hưu trí không đủ, ốm đau, thất nghiệp), Property risks (direct và indirect loss), Liability risks."],
["c1","Direct loss vs indirect (consequential) loss","Direct: tổn thất vật chất trực tiếp tài sản. Indirect: hệ quả kéo theo (mất thu nhập, chi phí phát sinh)."],
["c1","3 gánh nặng của rủi ro với xã hội","(1) Phải tăng quỹ khẩn cấp, (2) xã hội thiếu hàng hóa và dịch vụ, (3) lo lắng và sợ hãi."],

["c1","Self-insurance","Retention có kế hoạch, thường có quỹ dự phòng."],
["c1","Insurance (định nghĩa theo risk transfer)","Cơ chế chuyển rủi ro: insured chuyển hậu quả tài chính của rủi ro cho insurer, đổi lại trả premium."],
["c1","Cơ chế dòng tiền bảo hiểm","Clients/insureds đóng premiums vào insurance fund (do insurer quản lý). Khi rủi ro xảy ra, insureds nhận indemnity từ quỹ."],

["c1","Adverse selection","Xu hướng người có xác suất tổn thất cao hơn trung bình tìm mua bảo hiểm với phí tiêu chuẩn."],

["c1","Insurance vs gambling (2 khác biệt)","(1) Gambling tạo rủi ro mới, insurance chuyển rủi ro đã có (pure risk). (2) Gambling không có lợi ích xã hội, insurance có và insured không có cơ hội lãi."],
["c1","Insurance vs hedging (2 khác biệt)","(1) Insurance cho pure risk, hedging cho speculative (giá). (2) Insurance có thể giảm objective risk nhờ pooling, hedging chỉ chuyển rủi ro."],
["c1","Human life value","Giá trị hiện tại thu nhập ròng tương lai của một người; dùng ước lượng nhu cầu bảo hiểm nhân thọ."],

["c2","Probability distribution","Bảng/đồ thị các kết quả tổn thất có thể xảy ra và xác suất tương ứng."],

["c2","Insurable interest","Insured phải ở vị trí chịu tổn thất tài chính nếu sự kiện được bảo hiểm xảy ra."],
["c2","3 mục đích của insurable interest","Ngăn cờ bạc (prevent gambling), giảm moral hazard, đo lường mức tổn thất trong property insurance."],
["c2","4 dạng insurable interest trong P&C","Ownership, potential legal liability, secured creditors, contractual right."],
["c2","Insurable interest trong life insurance","Mua cho chính mình: mặc nhiên có. Mua cho người khác: phải có insurable interest với mạng sống người đó."],
["c2","Thời điểm insurable interest phải tồn tại","Property: tại thời điểm tổn thất. Life: chỉ cần lúc ký hợp đồng."],
["c2","Principle of indemnity","Insurer chi trả không quá số tiền tổn thất thực tế; insured không được lời từ tổn thất."],
["c2","2 mục đích của indemnity","Ngăn insured kiếm lời từ tổn thất, giảm moral hazard."],
["c2","Actual cash value (ACV)","Replacement cost trừ depreciation."],

["c2","Broad evidence rule","Xét mọi yếu tố liên quan chuyên gia dùng: ACV, fair market value, giá trị hiện tại thu nhập kỳ vọng, giá bán tài sản tương đương, ý kiến thẩm định."],

["c2","Công thức average (underinsurance, partial loss)","Indemnity = Actual loss × (Sum insured / Value of goods at risk)."],
["c2","Mục đích của average clause","Ngăn việc cố tình bảo hiểm thiếu giá trị để trả ít phí (moral hazard)."],
["c2","Deductible (định nghĩa và 3 mục đích)","Phần tổn thất insured tự chịu. Mục đích: loại khiếu nại nhỏ, giảm phí, giảm moral và morale hazard."],
["c2","4 loại deductible","Straight (excess), franchise, disappearing, aggregate."],

["c2","Franchise deductible","Loss ≤ mức: không trả. Loss > mức: trả toàn bộ loss."],
["c2","Disappearing deductible","Deductible giảm dần khi loss tăng; đến một mức loss thì bằng 0 và trả đủ."],
["c2","Aggregate deductible","Cộng dồn các tổn thất trong kỳ (thường 1 năm) để thỏa deductible; sau đó insurer trả đủ."],
["c2","First loss policy","Trả đến hết sum insured không xét tổng giá trị rủi ro. Sum insured cố ý thấp hơn giá trị; phí/ tỷ lệ phí thường cao hơn."],

["c2","Valued policy law","Luật một số bang buộc trả face amount khi total loss real property do peril trong luật. Mục đích: bảo vệ insured khi agent cố ý over-insure để lấy hoa hồng."],
["c2","Replacement cost insurance","Bồi thường không trừ khấu hao, vì ACV vẫn có thể gây thiệt hại lớn cho insured."],
["c2","Life insurance và indemnity","Life insurance không phải contract of indemnity; là valued policy trả số tiền đã định khi insured chết."],
["c2","Contribution","Áp dụng khi double insurance; các insurer chia tổn thất theo rateable proportion (theo tỷ lệ số tiền bảo hiểm)."],
["c2","Công thức contribution","Insurer i trả = Loss × (STBH của i / Tổng STBH tất cả hợp đồng)."],
["c2","5 điều kiện áp dụng contribution","≥2 hợp đồng; cùng peril; cùng insurable interest; cùng subject matter; mỗi insurer đều có trách nhiệm với tổn thất."],
["c2","Non-contribution clause","Hợp đồng không áp dụng với khiếu nại mà insured được bồi thường theo bảo hiểm khác."],
["c2","Subrogation","Insurer thế quyền insured để đòi bên thứ ba có lỗi số tiền đã chi trả. Hỗ trợ mạnh nguyên tắc indemnity."],
["c2","3 lợi ích của subrogation","Ngăn insured nhận hai lần, buộc người có lỗi chịu trách nhiệm, giúp giữ phí thấp."],
["c2","4 điểm cần nhớ về subrogation","Đòi tối đa số đã trả; insured không được làm tổn hại quyền subrogation; không áp dụng cho life insurance; không subrogate chống lại chính insured."],
["c2","Proximate cause","Nguyên nhân chủ động, hiệu quả khởi động chuỗi sự kiện dẫn đến kết quả, không có lực mới độc lập xen vào. Là nguyên nhân chi phối, không nhất thiết đầu hay cuối chuỗi."],
["c2","Ví dụ proximate cause: bão gây cháy xe vs lũ gây cháy","Bão (covered) là proximate cause, bồi thường toàn bộ. Lũ (excluded) là proximate cause thì insurer có thể từ chối."],
["c2","Contribution vs subrogation","Contribution: giữa các insurer (nhiều hợp đồng). Subrogation: insurer đòi bên thứ ba có lỗi."],

["c4","3 nhóm rủi ro doanh nghiệp (ch.4)","Personal accident and health, property, liability."],

["c4","6 nghiệp vụ của insurer tư nhân","Rate making, underwriting, production, claim settlement, reinsurance, investment."],
["c4","Rate making","Định giá bảo hiểm và tính premiums, do actuary thực hiện dựa trên kinh nghiệm tổn thất và thống kê ngành."],
