<script>
// [chapter, question, model answer (English), key points]
window.SHORT = [
["c1","Distinguish between risk and uncertainty.","Risk is used when the probabilities of possible outcomes can be estimated with some accuracy, while uncertainty is used when such probabilities cannot be estimated.",["Risk: probability estimable","Uncertainty: not estimable"]],
["c1","Distinguish between objective risk and subjective risk.","Objective risk (degree of risk) is the relative variation of actual loss from expected loss. Subjective risk is uncertainty based on a person's mental condition or state of mind.",["Relative variation of actual vs expected loss","Mental condition / state of mind"]],
["c1","Explain the difference between peril and hazard with an example.","A peril is the immediate cause of loss, whereas a hazard is a condition that increases the probability or severity of loss. For example, a flood is the peril, and the proximity of a house to a river is the hazard.",["Peril = immediate cause","Hazard = condition raising frequency/severity","Flood vs proximity to river"]],
["c1","Name and define the four types of hazard.","Physical hazard: tangible conditions in the environment that affect loss. Moral hazard: dishonesty or character defects that increase loss. Morale hazard: carelessness or indifference to loss. Legal hazard: features of the legal or regulatory system that increase loss frequency or severity.",["Physical","Moral (dishonesty)","Morale (carelessness)","Legal (legal system)"]],
["c1","Distinguish between pure risk and speculative risk.","Pure risk involves only the possibility of loss or no loss, while speculative risk involves the possibility of either profit or loss. Insurers generally insure pure risks.",["Pure: loss or no loss","Speculative: profit or loss","Insurers insure pure risk"]],
["c1","Distinguish between diversifiable and non-diversifiable risk.","Diversifiable risk affects only individuals or small groups and not the entire economy. Non-diversifiable risk affects the entire economy or large numbers of persons or groups.",["Small groups vs entire economy"]],
["c1","What is enterprise risk management?","Enterprise risk management combines into a single unified treatment program all major risks faced by the firm, including pure, speculative, strategic, operational and financial risks.",["Single unified program","All major risks"]],
["c1","List the three major burdens of risk on society.","(1) The size of an emergency fund must be increased. (2) Society is deprived of certain goods and services. (3) Worry and fear are present.",["Emergency fund","Deprived of goods/services","Worry and fear"]],
["c1","Describe the four methods of dealing with risk.","Risk avoidance: avoid the risky activity entirely. Loss prevention: reduce the probability that losses occur. Loss reduction: reduce the severity of losses that occur. Risk financing: arrange funds to pay for losses through retention, non-insurance transfer or insurance.",["Avoidance","Prevention","Reduction","Financing"]],
["c1","Explain the three forms of risk financing.","Retention: the firm or individual keeps part or all of the loss (active or passive). Non-insurance transfer: risk is transferred to a party other than an insurer (contracts, hedging, incorporation). Insurance: a pure risk is transferred to an insurer using pooling and the law of large numbers.",["Retention","Non-insurance transfer","Insurance"]],
["c1","What are the four basic characteristics of insurance?","Pooling of losses, payment of fortuitous losses, risk transfer, and indemnification.",["Pooling","Fortuitous","Risk transfer","Indemnification"]],
["c1","Explain pooling.","Pooling is the spreading of losses incurred by the few over the entire group, so that average loss is substituted for actual loss. It implies sharing of losses by the entire group and prediction of future losses with some accuracy based on the law of large numbers.",["Spread losses of few over group","Average replaces actual loss","Law of large numbers"]],
["c1","What is adverse selection and how do insurers control it?","Adverse selection is the tendency of persons with a higher-than-average chance of loss to seek insurance at standard rates. Insurers control it through underwriting, risk classification and pricing, medical or other inspections, deductibles, waiting periods, exclusions and the doctrine of utmost good faith.",["Definition","Underwriting","Classification/rates","Deductibles/exclusions/waiting periods"]],
["c1","What are the two major differences between insurance and gambling?","First, gambling creates a new speculative risk, whereas insurance transfers an existing pure risk. Second, gambling has no social benefit (one wins what another loses), whereas insurance is socially productive and the insured has no opportunity for gain beyond indemnity.",["New risk vs existing risk","Social productivity"]],
["c1","What are the two major differences between insurance and hedging?","First, insurance normally deals with pure risks, while hedging deals with speculative (price) risks. Second, insurance can reduce objective risk by pooling, while hedging only transfers risk to another party without reducing overall risk.",["Pure vs speculative risk","Pooling reduces risk vs transfer only"]],
["c1","List the economic and social roles of insurance.","Economic: financial stability for participants, protection of investments, effective capital mobilization, state budget stability. Social: contribution to social security, a safer and more stable society, peace of mind, creation of employment.",["4 economic roles","4 social roles"]],

["c2","Explain the law of large numbers and why it matters to insurers.","As the number of insured units increases, actual average losses tend to approach expected losses. Larger portfolios reduce objective risk and make losses more predictable, helping insurers set adequate premiums.",["Actual approaches expected","Reduces objective risk","Predictability"]],
["c2","List the requirements of an insurable risk.","A large number of exposure units; accidental and unintentional loss; determinable and measurable loss; no catastrophic loss; calculable chance of loss; economically feasible premium.",["6 requirements"]],
["c2","Explain why fire risk is insurable but unemployment risk is only partially insurable.","Fire meets all six requirements: many exposures, mostly accidental, measurable, not simultaneous, calculable and low premium. Unemployment fails several: some is voluntary, it can be catastrophic in a recession, chance of loss is hard to calculate and adverse selection and moral hazard can make premiums too costly.",["Fire meets six","Unemployment: voluntary, catastrophic, hard to calculate"]],
["c2","What is the principle of utmost good faith and what doctrines support it?","A higher degree of honesty is imposed on both parties to an insurance contract than on parties to other contracts. It is supported by the doctrines of representations, concealment and warranty.",["Higher honesty","Representations","Concealment","Warranty"]],
["c2","When does a misrepresentation allow the insurer to void the contract?","The contract is voidable at the insurer's option if the representation is material (the insurer would not have issued the policy or would have issued it on different terms), false (untrue or misleading) and relied upon by the insurer when issuing the policy.",["Material","False","Reliance"]],
["c2","What must a non-marine insurer prove to deny a claim based on concealment?","It must prove that the concealed fact was known by the insured to be material, and that the insured intended to defraud the insurer.",["Known to be material","Intent to defraud"]],
["c2","Compare disclosure obligations in life and non-life insurance.","In non-life insurance the obligation exists throughout the period the contract is in force and new changes must be disclosed on renewal. In life insurance it needs to be fulfilled only when requested by the insurer, and the insurer is bound by circumstances that existed at inception.",["Non-life: whole period, renewal","Life: when requested"]],
["c2","What remedies exist for breach of utmost good faith?","Termination or voidance of the contract, premium adjustment, insurance subject to additional conditions, denial of claim payment, and litigation.",["Voidance","Premium adjustment","Conditions","Denial","Litigation"]],
["c2","What is insurable interest and why is it required?","Insurable interest means the insured must be in a position to lose financially if a covered loss occurs. It is required to prevent gambling, to reduce moral hazard and to measure the amount of the insured's loss in property insurance.",["Financial loss","Prevent gambling","Reduce moral hazard","Measure the loss"]],
["c2","List the forms of insurable interest in property and casualty insurance.","Ownership of the property, potential legal liability, secured creditors (e.g. mortgagee), and contractual rights.",["Ownership","Legal liability","Secured creditor","Contractual right"]],
["c2","When must insurable interest exist in property and in life insurance?","In property insurance it must exist at the time of the loss. In life insurance it must exist only at the inception of the policy, not at the time of death.",["Property: time of loss","Life: inception"]],
["c2","State the principle of indemnity and its purposes.","The insurer agrees to pay no more than the actual amount of the loss; the insured should not profit from a loss. The purposes are to prevent the insured from profiting from a loss and to reduce moral hazard.",["No more than actual loss","Prevent profit","Reduce moral hazard"]],
["c2","Define actual cash value and explain the three methods used by courts.","ACV is replacement cost less depreciation. Courts use replacement cost less depreciation, fair market value (price a willing buyer pays a willing seller) and the broad evidence rule (all relevant factors an expert would consider).",["RC - depreciation","Fair market value","Broad evidence rule"]],
["c2","Explain the four types of deductible.","Straight deductible: the insured bears a fixed amount of each loss. Franchise deductible: no payment if loss is below the franchise, full payment if above. Disappearing deductible: the deductible decreases as loss increases until it disappears. Aggregate deductible: losses are accumulated over a period until the deductible is satisfied, then insurer pays in full.",["Straight","Franchise","Disappearing","Aggregate"]],
["c2","What are the purposes of a deductible?","To eliminate small claims, to reduce premiums, and to reduce moral hazard and attitudinal hazard.",["Eliminate small claims","Reduce premiums","Reduce moral/morale hazard"]],
["c2","Explain the average clause (pro-rata indemnity) with its formula.","When the sum insured is less than the value at risk, the insurer pays only a proportion of a partial loss: Indemnity = Actual loss × (Sum insured / Value of goods at risk). It deters deliberate underinsurance.",["Formula","Underinsurance","Moral hazard"]],
["c2","What is a first loss policy?","A policy in which the insurer pays up to the sum insured on any loss without considering the total value at risk. The sum insured is deliberately restricted by agreement, and the insurer often charges a higher rate on that sum insured.",["Pays up to sum insured","No average","Higher rate"]],
["c2","List the exceptions to the principle of indemnity.","Valued policy, valued policy laws, replacement cost insurance and life insurance.",["Valued policy","Valued policy law","Replacement cost","Life insurance"]],
["c2","Explain valued policy and valued policy laws.","A valued policy pays the face amount if a total loss occurs; value is agreed at issuance, typically for antiques and fine arts. A valued policy law requires payment of the face amount in a total loss to real property from specified perils, originally protecting insureds when agents deliberately overinsured for higher commission.",["Face amount on total loss","Agreed value at inception","Law protects from overinsurance disputes"]],
["c2","Explain contribution and its legal requirements.","Contribution applies in double insurance: insurers share a loss in rateable proportion to their sums insured. Requirements: at least two policies, same peril, same insurable interest, same subject matter, and each insurer liable under its own policy.",["Double insurance","Rateable proportion","5 requirements"]],
["c2","Define subrogation and explain how it supports indemnity.","Subrogation is the substitution of the insurer in place of the insured to claim indemnity from a negligent third party for a loss covered by insurance. It prevents double recovery by the insured, holds the negligent party responsible and helps hold down insurance rates.",["Insurer steps into insured's shoes","Prevents double recovery","Responsible party pays","Holds down rates"]],
["c2","State important points about the insurer's subrogation rights.","The insurer is entitled only to the amount it has paid; the insured cannot impair or interfere with subrogation rights after a loss; subrogation does not apply to life insurance; and the insurer cannot subrogate against its own insured.",["Only amount paid","No impairment","Not life insurance","Not against own insured"]],
["c2","Define proximate cause with an example.","Proximate cause is the active, efficient cause that sets in motion a train of events bringing about a result, without the intervention of any force from a new and independent source. If a covered storm knocks a tree onto a car and causes a fire, the storm is the proximate cause and the loss is covered; if an excluded flood causes a short-circuit and fire, the flood is the proximate cause and the claim may be denied.",["Dominant, effective cause","Covered example","Excluded example"]],

["c4","Distinguish between private and social insurance.","Government (social) insurance gives basic protection (death, health, retirement, unemployment) on a compulsory basis, based on social adequacy. Private insurance provides additional or supplementary protection, offers most property and casualty insurance, and is based on individual equity.",["Basic vs supplementary","Compulsory vs voluntary"]],
["c4","List the six operations of a private insurer.","Rate making, underwriting, production, claim settlement, reinsurance and investment.",["6 operations"]],
["c4","Explain the unique characteristics of insurance pricing.","Inverted production cycle (priced before costs are known), premium inadequacy exposure, ex-post cost determination (actual cost known only after the period), and total profitability that depends on premiums plus investment income.",["Inverted cycle","Inadequacy","Ex-post cost","Premium + investment"]],
["c4","What are the principles of underwriting?","Attain an underwriting profit, select prospective insureds according to company standards (to reduce adverse selection), and provide equity among policyholders.",["Profit","Select by standards","Equity"]],
["c4","Why do insurers use credit scoring in underwriting, and where can it misjudge applicants?","Credit scoring correlates with claim frequency and severity and is cheap and objective. It can misjudge people with thin credit histories, people with temporary hardship such as illness or unemployment who still drive safely, errors in credit files and low-income groups. Alternatives include driving record, claims history, mileage, vehicle type and telematics.",["Correlation with claims","Misjudgment cases","Alternatives"]],
["c4","Describe the claim settlement process and its objectives.","Process: notice of loss, investigation, adjuster determines covered loss and amount, proof of loss, decision to pay or deny, dispute resolution. Objectives: verification of a covered loss, fair and prompt payment (avoid fraud and unfair practices), and personal assistance to the insured.",["Notice → investigation → adjuster","3 objectives"]],
["c4","What is lowballing and why do insurers do it?","Lowballing is offering substantially less than the amount ultimately recoverable, compelling the insured to sue. Insurers may do it to cut claim costs, hoping the insured lacks knowledge, needs money quickly or will avoid the cost and time of litigation. It is a prohibited unfair claim practice.",["Definition","Reasons","Prohibited"]],
["c4","Name the four types of claim adjusters.","Agent (small first-party claims), company adjuster (salaried, one company), independent adjuster (fee-based, used in catastrophes), and public adjuster (represents the insured, paid by a percentage of the settlement).",["Agent","Company","Independent","Public"]],
["c4","Define reinsurance and the key terms.","Reinsurance is an arrangement in which the primary insurer transfers part or all of the potential losses to another insurer. The primary insurer is the ceding company, the accepting insurer is the reinsurer, the retention limit is the amount retained, and the amount transferred is a cession.",["Ceding company","Reinsurer","Retention limit","Cession"]],
["c4","Explain the reasons for using reinsurance.","To increase underwriting capacity, to stabilize profits, to protect against catastrophic losses, and to reduce the unearned premium reserve and improve the surplus position.",["Capacity","Stability","Catastrophe","UPR/surplus"]],
["c4","Compare facultative and treaty reinsurance.","Facultative is case-by-case and optional for both ceding and reinsurer; suited to large risks but slow. Treaty covers an entire portfolio automatically, cession is mandatory and acceptance is automatic, allowing immediate policy issuance. FacOb is an intermediate form.",["Case-by-case vs portfolio","Optional vs automatic","Speed"]],
["c4","Compare proportional and non-proportional reinsurance with examples.","Proportional: reinsurer takes a fixed share of losses and premium, e.g. 70/30 quota share (a $10M loss: $7M ceding, $3M reinsurer). Non-proportional: reinsurer pays losses above a set level for a fixed premium, e.g. $2M excess of $1M (a $3M loss: $1M ceding, $2M reinsurer).",["Quota share example","Excess of loss example"]],
["c4","Why does investment matter to insurers, and how do life and non-life insurers differ?","Premiums are paid in advance and can be invested until claims are paid; investment income reduces premiums and offsets poor underwriting results. Life insurers invest long-term because contracts are long-term; non-life insurers invest short-term.",["Premium in advance","Life long-term","Non-life short-term"]],
["c4","Why is insurance regulated?","To maintain insurer solvency, to compensate for inadequate consumer knowledge, to ensure reasonable rates (not excessive and not inadequate), and to make insurance available.",["Solvency","Consumer knowledge","Reasonable rates","Availability"]],
["c4","Define social insurance and list its basic characteristics.","Social insurance guarantees to replace or partially offset income lost due to sickness, maternity, occupational accident, occupational disease, retirement or death, based on contributions or state budget. It is compulsory, provides a floor of income, emphasizes social adequacy over individual equity, has benefits loosely related to earnings and prescribed by law, no means test, full funding unnecessary and is financially self-supporting.",["Definition","Compulsory","Floor of income","Social adequacy","No means test"]],
["c4","List the branches of social security recognized by the ILO.","Health protection, sickness benefits, unemployment benefits, old-age pensions, employment injury benefits, family and child benefits, maternity benefits, disability benefits and survivors' benefits.",["9 branches"]]
];

{ id:"k1", ch:"c2", src:"cô giao", topic:"Subrogation", title:"Kristen và tài xế say rượu",
scenario:`<p>A drunk driver ran a red light and smashed into Kristen's car. The cost to repair the car is <b>$8,000</b>. She has collision insurance on her car with a <b>$500 deductible</b>.</p>`,
parts:[
{q:"1. Can Kristen collect from both the negligent driver's insurer and her own insurer? Explain your answer.",
a:`<p><b>Không.</b> Kristen có thể đòi từ insurer của người gây lỗi <b>hoặc</b> từ insurer của chính mình, nhưng không được nhận từ cả hai cho cùng một tổn thất, vì <b>principle of indemnity</b> không cho phép insured kiếm lời từ tổn thất (tổng nhận không vượt $8,000).</p>
<p><b>Mẫu trả lời:</b> <i>No. Under the principle of indemnity, the insured should not profit from a loss. Kristen can collect her $8,000 loss only once. If she claims under her collision coverage, she receives $8,000 − $500 = $7,500 from her insurer, which can then recover its payment from the negligent driver (subrogation). She may still pursue the at-fault driver for her $500 uninsured deductible. She cannot collect the same loss from both insurers.</i></p>`},
{q:"2. Explain how subrogation supports the principle of indemnity in this case.",
a:`<p>Subrogation ngăn việc <b>nhận bồi thường hai lần</b> và buộc <b>người có lỗi</b> chịu trách nhiệm cuối cùng.</p>
<ul><li>Insurer của Kristen trả $7,500 rồi <b>thế quyền</b> đòi tài xế say rượu (hoặc insurer của người đó), tối đa số đã trả.</li>
<li>Kristen không thể vừa nhận $7,500 vừa nhận tiếp $8,000 từ bên gây lỗi. Cô chỉ được lấy lại phần deductible $500 chưa được bồi thường.</li>
<li>Kết quả: Kristen được đưa về vị trí cũ (không lời, không lỗ), người gây lỗi chịu trách nhiệm, phí bảo hiểm không bị đẩy lên.</li></ul>`}]},

{ id:"k2", ch:"c2", src:"cô giao", topic:"Insurable interest, concealment, subrogation", title:"Jeff, tòa nhà và nhà hàng thức ăn nhanh",
scenario:`<p>Jeff is a book dealer who purchased a building from Richard. Jeff obtained a loan from Gateway Bank to purchase the building, which held a mortgage on the building. Jeff planned to store his inventory of books in the building. He also planned to use part of the building for a fast-food restaurant. When Jeff applied for property insurance on the building, he did not tell the agent about the fast-food restaurant because premiums would be substantially higher. Eight months after the policy was issued, a fire occurred in the restaurant that caused substantial damage to the building.</p>`,
parts:[
{q:"a. Do any of the following parties have an insurable interest in the building at the time of loss? 1. Jeff 2. Richard 3. Gateway Bank",
a:`<p>Nhớ: với property, insurable interest phải có <b>tại thời điểm tổn thất</b>.</p>
<table><tr><th>Bên</th><th>Có?</th><th>Lý do và mức độ</th></tr>
<tr><td>Jeff</td><td><b>Có</b></td><td>Là <b>chủ sở hữu</b>, mất tiền nếu tòa nhà bị hư. Mức: toàn bộ giá trị tòa nhà (trừ phần giá trị thuộc quyền lợi của bank thì vẫn là của Jeff, bank chỉ giới hạn theo dư nợ).</td></tr>
<tr><td>Richard</td><td><b>Không</b></td><td>Đã bán tòa nhà, không còn sở hữu, không còn chịu thiệt tài chính khi cháy.</td></tr>
<tr><td>Gateway Bank</td><td><b>Có</b></td><td>Là <b>secured creditor</b> (mortgagee), tòa nhà là tài sản thế chấp. Mức: <b>giới hạn bằng số dư nợ vay còn lại</b> (tối đa).</td></tr></table>`},
{q:"b. Richard told Jeff he could save money by taking over Richard's existing insurance instead of purchasing a new policy. Can Richard validly assign his existing property insurance policy to Jeff without notifying the insurer? Explain.",
a:`<p><b>Không.</b> Hợp đồng property insurance là hợp đồng bảo vệ <b>quyền lợi của người được bảo hiểm</b>, không phải của tài sản. Khi Richard bán nhà, anh không còn insurable interest. Việc chuyển nhượng hợp đồng (assignment) cần <b>sự đồng ý của insurer</b>, vì insurer đã thẩm định rủi ro (underwriting) dựa trên Richard (character, moral hazard) và có thể từ chối Jeff hoặc đổi điều kiện/phí.</p>
<p><b>Ý chính viết bài:</b> personal contract; insurer's underwriting; need consent; Richard no longer has insurable interest; Jeff should purchase a new policy or obtain written consent/endorsement.</p>`},
{q:"c. Could Jeff's insurer deny coverage for the fire loss based on a material concealment? Explain.",
a:`<p><b>Có thể.</b> Áp dụng <b>utmost good faith, concealment</b>.</p>
<ol><li>Jeff <b>cố ý không khai</b> kế hoạch mở nhà hàng thức ăn nhanh (nondisclosure).</li>
<li>Thông tin này <b>trọng yếu</b>: nhà hàng làm tăng nguy cơ cháy, phí sẽ cao hơn đáng kể nếu insurer biết, hoặc insurer có thể từ chối/đổi điều kiện.</li>
<li>Để từ chối, insurer phải chứng minh: (1) Jeff biết thông tin là trọng yếu, (2) Jeff <b>có ý định lừa đảo</b>. Bằng chứng: Jeff không khai <i>vì phí sẽ cao hơn nhiều</i>, cho thấy anh biết nó trọng yếu và cố ý.</li></ol>
<p><b>Kết luận:</b> Hợp đồng <b>voidable</b> theo lựa chọn của insurer, insurer có thể hủy hợp đồng và từ chối bồi thường. (Vụ cháy xảy ra ngay tại nhà hàng, đúng với yếu tố bị giấu.)</p>`},
{q:"d. Investigation revealed an electrician improperly wired an electrical outlet in the restaurant, which caused the fire. Explain how subrogation might apply.",
a:`<p>Nếu insurer <b>đã chi trả</b> cho Jeff, insurer được <b>thế quyền</b> Jeff để đòi <b>thợ điện</b> (bên thứ ba có lỗi) khoản đã chi, tối đa bằng số đã trả.</p>
<ul><li>Jeff không được làm tổn hại quyền này (ví dụ ký miễn trách nhiệm cho thợ điện sau tổn thất).</li>
<li>Subrogation giúp giữ nguyên tắc indemnity và buộc thợ điện chịu trách nhiệm.</li>
<li><b>Lưu ý:</b> nếu insurer từ chối bồi thường vì concealment (câu c) thì chưa chi trả, nên chưa có subrogation. Subrogation chỉ phát sinh sau khi insurer trả tiền.</li></ul>`}]},

{ id:"k3", ch:"c2", src:"cô giao", topic:"Valued policy, replacement cost, life", title:"Ông Minh: 4 hợp đồng bảo hiểm",
scenario:`<p>Mr. Minh owns a small shipping company, a house and has a life insurance policy.</p>
<p><b>Contract 1: Hull insurance.</b> Valued policy for his fishing vessel, agreed value <b>VND 12 billion</b>, stated in the policy at inception. Three years later the vessel is totally lost in a collision. Independent surveyor: actual market value only about <b>VND 9 billion</b>.</p>
<p><b>Contract 2: Home insurance.</b> House insured against fire and explosion for <b>VND 6 billion</b>, value proposed by the insurance agent; actual value at issuance only about <b>VND 4.5 billion</b>. Mr. Minh paid full premium based on 6 billion. House completely destroyed by fire (electrical short circuit). Insurer argues overinsurance, liability limited to 4.5 billion.</p>
<p><b>Contract 3: Warehouse insurance.</b> Replacement cost provision (not ACV). The warehouse has been in use 8 years, depreciated by <b>40%</b>. Cost to rebuild an equivalent new warehouse is <b>VND 2 billion</b>. Completely destroyed by a storm.</p>
<p><b>Contract 4: Life insurance.</b> Sum insured <b>VND 3 billion</b>. Mr. Minh dies of a stroke the following year. Family's actual economic loss (lost future income) is only about <b>VND 2 billion</b>.</p>`,
parts:[
{q:"a) Contract 1: how much will the insurer pay for the vessel? Explain the legal basis.",
a:`<p>Insurer trả <b>VND 12 tỷ</b>.</p>
<p><b>Cơ sở:</b> đây là <b>valued policy</b>, một ngoại lệ của nguyên tắc indemnity. Hai bên đã <b>thỏa thuận giá trị ngay lúc ký</b> và ghi rõ trong hợp đồng; khi xảy ra <b>total loss</b>, insurer trả đúng giá trị thỏa thuận (face amount), <b>không xét giá thị trường thực tế lúc tổn thất</b> (9 tỷ). Không có gian lận hay misrepresentation nên insurer không thể điều chỉnh lại giá trị.</p>`},
{q:"b) Contract 2: if the valued policy law applies, is the insurer's argument (pay only 4.5 billion) acceptable? How much should actually be paid? Why?",
a:`<p><b>Không chấp nhận.</b> Insurer phải trả <b>VND 6 tỷ</b> (face amount).</p>
<p><b>Lý do:</b> valued policy law yêu cầu trả face amount khi <b>total loss real property</b> do peril được liệt kê (fire). Mục đích của luật là bảo vệ insured khỏi tranh chấp khi <b>agent đã cố ý/vô ý bảo hiểm quá giá trị</b> để lấy hoa hồng. Ở đây chính agent đề xuất 6 tỷ, ông Minh đã trả phí đầy đủ cho 6 tỷ, nên insurer không thể viện dẫn overinsurance để giảm bồi thường.</p>
<p><b>Đối chiếu:</b> nếu không có valued policy law thì theo indemnity chỉ nhận actual loss 4.5 tỷ.</p>`},
{q:"c) Contract 3: calculate the amount payable under replacement cost. Compare with ACV.",
a:`<table><tr><th>Cơ sở</th><th>Tính toán</th><th>Kết quả</th></tr>
<tr><td>Replacement cost</td><td>Không trừ khấu hao</td><td><b>VND 2 tỷ</b></td></tr>
<tr><td>ACV</td><td>2 tỷ − (40% × 2 tỷ) = 2 − 0.8</td><td><b>VND 1.2 tỷ</b></td></tr></table>
<p>Chênh lệch: <b>VND 0.8 tỷ</b>. Replacement cost không khấu trừ depreciation vì ít người dự trù khấu hao, ACV vẫn có thể gây thiệt hại đáng kể cho insured.</p>`},
{q:"d) Contract 4: is the insurer entitled to pay only VND 2 billion (family's actual loss) instead of 3 billion? Explain.",
a:`<p><b>Không.</b> Insurer phải trả <b>VND 3 tỷ</b>.</p>
<p><b>Lý do:</b> life insurance <b>không phải contract of indemnity</b>. Đây là <b>valued policy</b> trả số tiền đã định cho beneficiary khi insured chết, không cần chứng minh thiệt hại kinh tế thực tế (vì giá trị sinh mạng không đo được chính xác). Insurable interest (với chính mình) chỉ cần tại lúc ký hợp đồng. Nguyên tắc indemnity và actual loss không áp dụng.</p>`}]},

{ id:"k4", ch:"c2", src:"cô giao", topic:"Valued policy", title:"Megan và chiếc bàn cổ",
scenario:`<p>Megan owns an antique table that has a current market value of $12,000. The table is specifically insured for $12,000 under a <b>valued policy</b>. The table is totally destroyed when a tornado touches down and damages Megan's home. At the time of loss, the table had an estimated market value of $10,000. How much will Megan collect for the loss? Explain.</p>`,
parts:[{q:"How much will Megan collect?",
a:`<p><b>$12,000.</b></p>
<p><i>Because the table is insured under a valued policy, the insurer and insured agreed on the value ($12,000) when the policy was issued. In the event of a total loss, the insurer pays the face amount regardless of the market value at the time of loss ($10,000). A valued policy is an exception to the principle of indemnity.</i></p>`}]},

{ id:"k5", ch:"c2", src:"cô giao", topic:"Insurable interest", title:"Jake, chiếc thuyền đánh cá và các bên liên quan",
scenario:`<p>Jake borrowed <b>$800,000</b> from Gateway Bank to purchase a fishing boat. He keeps the boat at a dock owned by the Harbor Company. He uses the boat to earn income by fishing. Jake also has a contract with the White Shark Fishing Company to transport tuna from one port to another.</p>`,
parts:[
{q:"a. Do any of the following parties have an insurable interest in Jake or his property? If so, explain the extent. 1. Gateway Bank 2. Harbor Company 3. White Shark Fishing Company",
a:`<table><tr><th>Bên</th><th>Có?</th><th>Dạng quyền lợi và mức độ</th></tr>
<tr><td>Gateway Bank</td><td><b>Có</b></td><td><b>Secured creditor.</b> Thuyền là tài sản thế chấp. Mức: tối đa bằng <b>số dư nợ còn lại</b> (đến $800,000 và giảm dần khi trả nợ). Cũng có thể có insurable interest trong <b>mạng sống Jake</b> đến mức khoản vay (credit life).</td></tr>
<tr><td>Harbor Company</td><td><b>Có (hạn chế)</b></td><td><b>Potential legal liability</b> (bailee): có thể bị buộc bồi thường nếu thuyền hư hại khi neo tại bến do lỗi của mình. Mức: giới hạn theo <b>trách nhiệm pháp lý tiềm tàng</b> (tối đa tới giá trị thuyền) và có thể gồm phí neo bến chưa thu. Không phải chủ sở hữu nên không có interest đầy đủ.</td></tr>
<tr><td>White Shark Fishing Co.</td><td><b>Có (hạn chế)</b></td><td><b>Contractual right:</b> dựa vào chiếc thuyền để vận chuyển cá ngừ. Nếu thuyền mất, White Shark chịu thiệt (chi phí vận chuyển thay thế, lợi nhuận mất). Mức: giới hạn bằng <b>thiệt hại tài chính do hợp đồng không được thực hiện</b>, không phải toàn bộ giá trị thuyền. Cũng có thể có interest với Jake như một bên thực hiện hợp đồng chủ chốt.</td></tr></table>`},
{q:"b. If Jake did not own the boat but operated it on behalf of White Shark Fishing Company, would he have an insurable interest in the boat?",
a:`<p><b>Có, ở mức hạn chế.</b></p>
<ul><li><b>Potential legal liability</b> (bailee): Jake có thể phải chịu trách nhiệm nếu thuyền hư do lỗi của mình khi đang vận hành. Mức: tối đa bằng giá trị thuyền (mức trách nhiệm tiềm tàng).</li>
<li><b>Contractual/earnings interest:</b> nếu thuyền mất, Jake mất việc và thu nhập từ hợp đồng.</li></ul>
<p>Nhưng Jake <b>không phải chủ sở hữu</b>, nên không có interest đầy đủ như chủ thuyền; mức bồi thường bị giới hạn theo đúng phần thiệt hại tài chính của anh.</p>`}]},

{ id:"k6", ch:"c2", src:"cô giao", topic:"ACV", title:"Ashley và bộ bàn ăn",
scenario:`<p>Ashley purchased a dining room set for $5,000 and insured the furniture on an <b>actual cash value</b> basis. Three years later, the set was destroyed in a fire. At the time of loss, the property had depreciated in value by <b>50 percent</b>. The replacement cost of a new dining room set at the time of loss was <b>$6,000</b>. Ignoring any deductible, how much will Ashley collect? Explain.</p>`,
parts:[{q:"How much will Ashley collect?",
a:`<div class="formula">ACV = Replacement cost − Depreciation<br>Depreciation = $6,000 × 50% = $3,000<br>ACV = 6,000 − 3,000 = <b>$3,000</b></div>
<p><b>Bẫy:</b> không dùng giá mua ban đầu ($5,000) để tính. Khấu hao áp dụng lên <b>replacement cost hiện tại</b> ($6,000). Đáp án $3,000 (không phải $2,500, không phải $5,000).</p>`}]},

{ id:"k7", ch:"c1", src:"cô giao", topic:"Risk management techniques", title:"Michael: chọn kỹ thuật cho từng exposure",
scenario:`<p>Michael is a college senior majoring in marketing. He owns a high-mileage 2003 Ford with a current market value of $2,500. The replacement value of his clothes, television, stereo, cell phone and other personal property in a rented apartment totals $10,000. He uses disposable contact lenses, which cost $200 for a six-month supply. He has a waterbed in his rented apartment that has leaked in the past. An avid runner, he runs five miles daily in a nearby public park that has a reputation for being extremely dangerous because of drug dealers, assaults, muggings and drive-by shootings. Michael's parents both work to help him pay his tuition.</p><p>For each risk, identify an appropriate risk management technique and explain.</p>`,
parts:[
{q:"a. Physical damage to the Ford from a collision with another motorist",a:`<p><b>Retention</b> (không mua collision), kèm loss prevention (lái xe an toàn). Xe giá trị thấp ($2,500), phí collision và deductible có thể lớn so với giá trị xe.</p>`},
{q:"b. Liability lawsuit from negligent operation of his car",a:`<p><b>Insurance</b> (auto liability). Tổn thất có thể rất lớn, vượt xa khả năng tự chịu, và là yêu cầu pháp lý.</p>`},
{q:"c. Total loss of personal property because of a grease fire in the kitchen",a:`<p><b>Insurance</b> (renters insurance) kết hợp <b>loss prevention</b> (nấu ăn cẩn thận, bình chữa cháy). $10,000 là đáng kể với sinh viên, xác suất thấp, mức độ lớn.</p>`},
{q:"d. Disappearance of one contact lens",a:`<p><b>Retention.</b> Tổn thất rất nhỏ, dễ dự đoán, tự chịu được.</p>`},
{q:"e. Waterbed leak that causes property damage to the apartment",a:`<p><b>Avoidance</b> (bỏ giường nước) hoặc <b>loss prevention</b> (kiểm tra, thay vật liệu); phần trách nhiệm với căn hộ có thể dùng <b>insurance</b> (renters liability). Rủi ro đã từng xảy ra và có thể loại bỏ.</p>`},
{q:"f. Physical assault by gang members in the park where he runs",a:`<p><b>Avoidance</b> (chuyển sang chạy chỗ an toàn hơn hoặc phòng tập) hoặc loss prevention. Đây là hoạt động có thể thay thế dễ dàng, rủi ro rõ ràng.</p>`},
{q:"g. Loss of tuition assistance from his father who is killed by a drunk driver",a:`<p><b>Insurance</b> (life insurance trên cha mẹ, dựa trên <b>human life value</b>); có thể bổ sung tiết kiệm/học bổng. Chết sớm là tổn thất lớn, không thể ngăn hoàn toàn.</p>`}]},

{ id:"k8", ch:"c1", src:"cô giao", topic:"Chương 1 thảo luận", title:"Jack: xe bị trộm",
scenario:`<p>Today is an unlucky day for Jack. His car is stolen. How could he finance buying a new one? Borrow? Savings? Insurance? <br>Task: list the short-term and long-term financial consequences; pros and cons of loan vs personal savings; how risk impacts personal finance; how an auto insurance policy would help; brainstorm prevention actions.</p>`,
parts:[
{q:"Short-term and long-term financial consequences",a:`<ul><li><b>Ngắn hạn:</b> mất phương tiện đi làm/đi lại, chi phí thuê xe/di chuyển, phải gấp rút quyết định tài chính.</li><li><b>Dài hạn:</b> nợ vay và lãi, cạn quỹ tiết kiệm/khẩn cấp, ảnh hưởng mục tiêu tài chính khác, phí bảo hiểm có thể tăng.</li></ul>`},
{q:"Loan vs personal savings",a:`<table><tr><th></th><th>Ưu</th><th>Nhược</th></tr><tr><td>Loan</td><td>Có xe ngay, giữ tiết kiệm</td><td>Trả lãi, áp lực trả nợ, tăng gánh nặng tài chính</td></tr><tr><td>Savings</td><td>Không lãi, không nợ</td><td>Cạn quỹ khẩn cấp, mất cơ hội đầu tư, có thể không đủ</td></tr></table>`},
{q:"How would an auto insurance policy help Jack?",a:`<p>Nếu có coverage cho trộm cắp (comprehensive), insurer bồi thường (theo ACV, trừ deductible), Jack chuyển rủi ro tài chính cho insurer, không phải rút tiết kiệm hay vay. Đó là <b>risk financing bằng insurance</b>.</p>`},
{q:"Prevention actions",a:`<p>Khóa vô lăng, báo động, GPS định vị, đỗ nơi có bảo vệ/camera, không để đồ giá trị trong xe, đỗ garage. Đây là <b>loss prevention</b>.</p>`}]},

// ============ ĐỀ LUYỆN TỰ SOẠN ============
{ id:"n1", ch:"c2", src:"đề luyện", topic:"Contribution", title:"Hai hợp đồng cho một ngôi nhà",
scenario:`<p>A house is insured against fire with <b>Insurer A for VND 600 million</b> and <b>Insurer B for VND 400 million</b>. Both policies cover the same peril, the same insurable interest and the same house, and both were in force on the date of loss.</p>`,
parts:[
{q:"a. A fire causes a loss of VND 250 million. How much does each insurer pay?",a:`<div class="formula">A = 250 × 600/1,000 = <b>150</b> triệu<br>B = 250 × 400/1,000 = <b>100</b> triệu<br>Tổng = 250 triệu = actual loss.</div>`},
{q:"b. The house is totally destroyed and its value is VND 1,200 million. How much does each insurer pay, and how much does the insured bear?",a:`<p>Mỗi insurer chỉ trả tối đa sum insured của mình: A 600 triệu, B 400 triệu, tổng 1,000 triệu. Insured tự chịu <b>200 triệu</b> (underinsurance).</p>`},
{q:"c. If Policy B had started after the fire, how would the answer to (a) change?",a:`<p>Không có double insurance, không áp dụng contribution. Insurer A trả toàn bộ <b>250 triệu</b> (sum insured 600 triệu đủ để trả).</p>`}]},

{ id:"n2", ch:"c2", src:"đề luyện", topic:"Average / underinsurance", title:"Kho hàng bảo hiểm thiếu giá trị",
scenario:`<p>A warehouse has a value of <b>VND 2,000 million</b>. The owner insures it for <b>VND 1,500 million</b> under a policy with an average clause.</p>`,
parts:[
{q:"a. A fire causes a partial loss of VND 400 million. Calculate the indemnity.",a:`<div class="formula">Indemnity = 400 × (1,500 / 2,000) = <b>300</b> triệu<br>Insured tự chịu 100 triệu.</div>`},
{q:"b. The warehouse is totally destroyed. Calculate the indemnity.",a:`<p>Total loss thì bồi thường = <b>sum insured = 1,500 triệu</b> (không vượt sum insured).</p>`},
{q:"c. If the sum insured were VND 2,500 million, what would the indemnity be for the partial loss of 400 million and for a total loss?",a:`<p>Overinsurance: partial loss: <b>400 triệu</b> (actual loss). Total loss: <b>2,000 triệu</b> (actual value). Không bồi thường vượt tổn thất thực tế.</p>`},
{q:"d. Explain the purpose of the average clause.",a:`<p>Ngăn người mua <b>cố tình bảo hiểm thiếu giá trị</b> để trả ít phí nhưng vẫn mong được bồi thường tổn thất nhỏ đầy đủ (moral hazard). Insured tự chịu phần thiếu hụt.</p>`}]},

{ id:"n3", ch:"c2", src:"đề luyện", topic:"Deductibles", title:"Ba tổn thất trong một năm",
scenario:`<p>During one policy year an insured suffers three losses: <b>$600, $1,500 and $4,000</b>. Calculate the total indemnity paid under each deductible type.</p>`,
parts:[
{q:"a. Straight deductible of $1,000 (per loss)",a:`<p>$600 → 0 (nhỏ hơn deductible). $1,500 → 500. $4,000 → 3,000. <b>Tổng = $3,500.</b></p>`},
{q:"b. Franchise deductible of $1,000 (per loss)",a:`<p>$600 → 0. $1,500 → 1,500 (vượt franchise nên trả đủ). $4,000 → 4,000. <b>Tổng = $5,500.</b></p>`},
{q:"c. Aggregate deductible of $3,000 (per year)",a:`<table><tr><th>Claim</th><th>Cộng dồn</th><th>Trả</th></tr><tr><td>$600</td><td>600</td><td>0</td></tr><tr><td>$1,500</td><td>2,100</td><td>0</td></tr><tr><td>$4,000</td><td>6,100</td><td>Còn thiếu deductible 900, trả 4,000 − 900 = <b>3,100</b></td></tr></table><p><b>Tổng = $3,100.</b></p>`}]},

{ id:"n4", ch:"c2", src:"đề luyện", topic:"Disappearing deductible", title:"Disappearing deductible",
scenario:`<p>A policy has a disappearing deductible: the deductible is <b>$500</b> for a loss of $500 or less, and it <b>decreases by 10 cents for each $1 of loss above $500</b>, until it reaches zero. (Rule dùng cho bài này để tính; slide của cô cho bảng ví dụ.)</p>`,
parts:[
{q:"a. Calculate the payment for losses of $500, $1,000, $2,000 and $3,000.",a:`<table><tr><th>Loss</th><th>Deductible</th><th>Payment</th></tr><tr><td>500</td><td>500</td><td>0</td></tr><tr><td>1,000</td><td>500 − 0.1×500 = 450</td><td>550</td></tr><tr><td>2,000</td><td>500 − 0.1×1,500 = 350</td><td>1,650</td></tr><tr><td>3,000</td><td>500 − 0.1×2,500 = 250</td><td>2,750</td></tr></table><p>Ba dòng đầu khớp bảng trong slide.</p>`},
{q:"b. At what loss does the deductible disappear completely?",a:`<p>500 − 0.1 × (L − 500) = 0 ⇒ L = <b>$5,500</b>. Từ mức này insurer trả đủ loss.</p><p><i>Lưu ý:</i> bảng slide ghi deductible $5 tại loss $5,000 (có vẻ là lỗi hoặc dùng quy tắc khác; theo quy tắc trên sẽ là $50). Hãy hỏi cô nếu đề thi dùng số đó.</p>`}]},

{ id:"n5", ch:"c4", src:"đề luyện", topic:"Reinsurance", title:"Quota share và excess of loss",
scenario:`<p>An insurer has two reinsurance arrangements: (1) a <b>60/40 quota share</b> (insurer keeps 60%), and (2) a separate excess of loss treaty of <b>$3M excess of $2M</b>.</p>`,
parts:[
{q:"a. Under the quota share, a loss of $2.5M occurs. How much does each party pay? How is premium shared?",a:`<p>Ceding company: 60% × 2.5 = <b>$1.5M</b>. Reinsurer: 40% × 2.5 = <b>$1.0M</b>. Phí gốc cũng chia 60/40 (proportional).</p>`},
{q:"b. Under the excess of loss treaty, calculate the reinsurer's payment and the ceding company's payment for losses of $1.5M, $4.2M and $7M.",a:`<table><tr><th>Loss</th><th>Reinsurer</th><th>Ceding</th></tr>
<tr><td>1.5M</td><td>0</td><td>1.5M (dưới retention 2M)</td></tr>
<tr><td>4.2M</td><td>4.2 − 2 = 2.2M</td><td>2.0M</td></tr>
<tr><td>7M</td><td>tối đa 3M (cap)</td><td>2M + (7 − 5) = 4M (phần vượt giới hạn 5M quay về ceding)</td></tr></table>`},
{q:"c. A primary insurer receives a proposal to insure a $200M refinery. Its retention is $20M. Which reinsurance form is most suitable and why?",a:`<p><b>Facultative reinsurance.</b> Đây là rủi ro đơn lẻ vượt xa mức retention ($200M so với $20M); insurer chọn xếp riêng cho từng rủi ro, và phải đảm bảo reinsurance trước khi phát hành hợp đồng. Nhược điểm: không chắc reinsurer chấp nhận, phát hành chậm.</p>`}]},

{ id:"n6", ch:"c2", src:"đề luyện", topic:"Proximate cause", title:"Động đất, sét đánh và nước chữa cháy",
scenario:`<p>A property policy covers fire and excludes earthquake. Analyze the two situations.</p>`,
parts:[
{q:"1. An earthquake breaks a gas pipe and a fire destroys the house.",a:`<p>Chuỗi: động đất → vỡ ống gas → cháy → nhà cháy. <b>Proximate cause = động đất</b> (nguyên nhân chi phối, mỗi bước dự đoán được). Động đất bị loại trừ nên insurer <b>có thể từ chối</b> (theo logic bài giảng, giống ví dụ lũ gây chập điện). Trong thực tế cần xem hợp đồng có điều khoản "ensuing fire" hay không.</p>`},
{q:"2. Lightning strikes a warehouse and starts a fire. Water used by firefighters ruins the stored goods that the fire did not reach.",a:`<p>Sét gây cháy (covered peril) là nguyên nhân chi phối của cả chuỗi, nước chữa cháy là hệ quả trực tiếp, không có nguồn độc lập mới xen vào. <b>Proximate cause = fire (covered)</b>, tổn thất do nước chữa cháy cũng được bồi thường.</p>`}]},

{ id:"n7", ch:"c2", src:"đề luyện", topic:"Utmost good faith", title:"Khai báo khi mua và khi tái tục",
scenario:`<p>(1) Hoa, 30, applies for life insurance and answers "No" to the question "Do you smoke?" although she smokes 10 cigarettes a day. She dies in a traffic accident one year later. (2) Separately, a firm renews its fire policy and does not tell the insurer that during the year it converted part of its warehouse into paint storage.</p>`,
parts:[
{q:"a. Can the life insurer void the policy? Which doctrine applies and what must be proved?",a:`<p>Doctrine: <b>misrepresentation</b>. Hoa đã trả lời sai một câu hỏi (statement false). Hợp đồng <b>voidable</b> nếu: (1) <b>material</b>: nếu biết hút thuốc, insurer sẽ không cấp hoặc cấp với phí/điều kiện khác; (2) <b>false</b>: có; (3) <b>reliance</b>: insurer dựa vào câu trả lời để cấp hợp đồng với mức phí đó.</p><p>Nếu đủ ba yếu tố, insurer có thể hủy hợp đồng hoặc chọn <b>điều chỉnh phí/điều kiện</b> (remedies).</p>`},
{q:"b. If Hoa had simply never been asked about smoking and did not mention it, what would change?",a:`<p>Trong life insurance, nghĩa vụ khai báo chỉ cần thực hiện <b>khi insurer yêu cầu</b>; nếu không được hỏi, việc không nêu không bị coi là concealment như trong non-life.</p>`},
{q:"c. Did the firm breach utmost good faith in case (2)?",a:`<p>Trong <b>non-life</b>, nghĩa vụ khai báo tồn tại suốt thời hạn và khi tái tục phải khai báo thay đổi mới phát sinh. Lưu giữ sơn là thay đổi trọng yếu làm tăng nguy cơ cháy. Nếu <b>cố ý</b> không khai, đó là <b>concealment</b>; insurer phải chứng minh firm biết là trọng yếu và có ý định lừa đảo, rồi có thể hủy hợp đồng/từ chối bồi thường.</p>`}]},

{ id:"n8", ch:"c2", src:"đề luyện", topic:"Insurable interest (life và property)", title:"Ly hôn, bán xe và người hàng xóm",
scenario:`<p>(1) Lan buys a life policy on her husband Nam and is named beneficiary. Two years later they divorce; Lan keeps paying premiums. Nam then dies. (2) Tuan buys a life policy on a neighbor he barely knows. (3) Minh sells his insured car to Hung on 1 June but the policy remains in Minh's name; the car is stolen on 5 June.</p>`,
parts:[
{q:"a. Case (1): Can Lan collect?",a:`<p><b>Có.</b> Trong life insurance, insurable interest chỉ cần tồn tại <b>lúc ký hợp đồng</b> (Lan là vợ nên có). Ly hôn sau đó không làm mất hiệu lực.</p>`},
{q:"b. Case (2): Is the contract enforceable?",a:`<p><b>Không.</b> Tuan không có insurable interest (không chịu thiệt tài chính khi người hàng xóm chết). Hợp đồng sẽ thành <b>gambling</b> và tạo moral hazard, trái lợi ích công cộng.</p>`},
{q:"c. Case (3): Can Minh recover for the theft?",a:`<p><b>Không.</b> Với property insurance, insurable interest phải có <b>tại thời điểm tổn thất</b>. Minh đã bán xe nên không còn chịu thiệt tài chính. Hung chưa được bảo hiểm trừ khi policy được chuyển nhượng với sự đồng ý của insurer.</p>`}]},

{ id:"n9", ch:"c2", src:"đề luyện", topic:"ACV, RC, FMV", title:"Bộ ghế sofa",
scenario:`<p>A sofa was bought 4 years ago for $1,500. The cost of a new, equivalent sofa today is <b>$2,000</b>. Depreciation is <b>10% per year</b> (of replacement cost). A second-hand dealer would sell the same sofa for <b>$900</b>. The sofa is destroyed by fire.</p>`,
parts:[
{q:"a. Calculate the payment under an ACV policy (replacement cost less depreciation).",a:`<div class="formula">Depreciation = 2,000 × 10% × 4 = 800<br>ACV = 2,000 − 800 = <b>$1,200</b></div>`},
{q:"b. Under a replacement cost policy?",a:`<p><b>$2,000</b> (không trừ khấu hao).</p>`},
{q:"c. If a court used the fair market value method?",a:`<p><b>$900</b> (giá người mua tự nguyện trả cho người bán tự nguyện, ở đây tham chiếu giá sofa cũ).</p>`},
{q:"d. What does the broad evidence rule require?",a:`<p>Xét <b>tất cả yếu tố liên quan</b>: ACV ($1,200), fair market value ($900), giá trị hiện tại thu nhập kỳ vọng, giá bán tài sản tương đương, ý kiến thẩm định viên... rồi kết luận một giá trị hợp lý (thường trong khoảng $900 đến $1,200).</p>`}]},

{ id:"n10", ch:"c2", src:"đề luyện", topic:"Insurable risk", title:"Lũ lụt ở thành phố ven biển",
scenario:`<p>Nearly all homes in a coastal city lie in a floodplain. A private insurer is asked to sell flood insurance there. Evaluate flood as an insurable risk against the six requirements.</p>`,
parts:[
{q:"Which requirements are met and which are not?",a:`<table><tr><th>Điều kiện</th><th>Đạt?</th><th>Nhận xét</th></tr>
<tr><td>1. Large number of exposure units</td><td>Có</td><td>Nhiều nhà</td></tr>
<tr><td>2. Accidental, unintentional</td><td>Có</td><td>Lũ là rủi ro ngẫu nhiên</td></tr>
<tr><td>3. Determinable, measurable</td><td>Có</td><td>Có thể thẩm định thiệt hại</td></tr>
<tr><td>4. No catastrophic loss</td><td><b>Không</b></td><td>Gần như mọi nhà cùng bị ảnh hưởng cùng lúc</td></tr>
<tr><td>5. Calculable chance of loss</td><td>Khó</td><td>Biến đổi khí hậu làm khó ước lượng</td></tr>
<tr><td>6. Economically feasible premium</td><td><b>Không</b></td><td>Adverse selection (chỉ nhà ở vùng trũng mua) làm phí quá đắt</td></tr></table>
<p>Kết luận: thường <b>không bảo hiểm tư được</b> hoặc cần sự tham gia của nhà nước, reinsurance, giới hạn phạm vi. Rủi ro này cũng là <b>non-diversifiable</b>.</p>`}]},

{ id:"n11", ch:"c4", src:"đề luyện", topic:"Underwriting", title:"Kho gỗ 8 triệu đô",
scenario:`<p>An insurer's underwriting policy classifies fireworks manufacturing as <b>prohibited</b>, restaurants as <b>acceptable (limit $5M)</b>, and wooden warehouses as <b>borderline (limit $5M, senior underwriter approval required)</b>. A wooden warehouse storing furniture applies for $8M of fire cover.</p>`,
parts:[
{q:"How is the application classified, and what are the possible underwriting decisions?",a:`<p>Phân loại: <b>borderline</b>. Yêu cầu $8M vượt giới hạn $5M và cần <b>senior underwriter</b> duyệt.</p>
<p>Ba quyết định có thể: <b>accept</b> (nếu duyệt ngoại lệ), <b>accept subject to modifications</b> (giảm hạn mức xuống $5M, tăng deductible, yêu cầu sprinkler/phòng cháy, tăng phí; xếp <b>facultative reinsurance</b> cho phần vượt), hoặc <b>reject</b>.</p>
<p>Nguyên tắc: underwriting profit, chọn lọc theo tiêu chuẩn (giảm adverse selection), công bằng giữa các policyholders.</p>`}]},

{ id:"n12", ch:"c2", src:"đề luyện", topic:"Tổng hợp: contribution, average, subrogation", title:"Cửa hàng bị cháy do thợ điện",
scenario:`<p>A shop building worth <b>VND 3,000 million</b> is insured with <b>Insurer X for 2,000 million</b> and <b>Insurer Y for 1,000 million</b> (same peril, interest and subject matter, both in force). A fire caused by a negligent electrician causes a partial loss of <b>VND 1,200 million</b>. Both insurers pay the claim.</p>`,
parts:[
{q:"a. How much does each insurer pay?",a:`<p>Tổng sum insured = 3,000 = giá trị tài sản, không underinsurance. Áp dụng contribution:<br>X = 1,200 × 2,000/3,000 = <b>800 triệu</b>; Y = 1,200 × 1,000/3,000 = <b>400 triệu</b>.</p>`},
{q:"b. What rights do the insurers have against the electrician?",a:`<p><b>Subrogation:</b> mỗi insurer thế quyền đòi thợ điện số đã trả (X: 800, Y: 400, tổng tối đa 1,200 triệu). Insured không được làm tổn hại quyền này.</p>`},
{q:"c. If only Policy X existed, how much would be paid for the same loss?",a:`<p>Sum insured 2,000 &lt; value 3,000 nên áp dụng average: 1,200 × 2,000/3,000 = <b>800 triệu</b>. Insured tự chịu 400 triệu.</p>`}]},

{ id:"n13", ch:"c1", src:"đề luyện", topic:"Risk management techniques", title:"Quán cà phê nhỏ",
scenario:`<p>Lan opens a small café in a rented space. Choose a suitable risk management technique for each exposure: (1) fire damage to the café's equipment and stock, (2) customers who slip on a wet floor and sue, (3) breakage of cheap cups, (4) staff theft of cash, (5) volatility in the price of coffee beans, (6) opening at night in a street with frequent robberies.</p>`,
parts:[{q:"Match each exposure to a technique and give a reason.",a:`<table><tr><th>Exposure</th><th>Kỹ thuật</th><th>Lý do</th></tr>
<tr><td>1. Cháy</td><td>Insurance + loss prevention</td><td>Tổn thất lớn, xác suất thấp</td></tr>
<tr><td>2. Khách trượt ngã</td><td>Insurance (public liability) + loss prevention (biển cảnh báo, lau sàn)</td><td>Có thể bị kiện tốn kém</td></tr>
<tr><td>3. Vỡ ly rẻ</td><td>Retention</td><td>Nhỏ, dễ dự đoán</td></tr>
<tr><td>4. Nhân viên lấy cắp tiền</td><td>Loss prevention (kiểm soát nội bộ, camera), có thể thêm fidelity insurance</td><td>Giảm cơ hội, giảm moral hazard</td></tr>
<tr><td>5. Giá hạt cà phê</td><td>Non-insurance transfer (hedging hoặc hợp đồng giá cố định với nhà cung cấp)</td><td>Đây là financial/speculative risk, không bảo hiểm được</td></tr>
<tr><td>6. Mở cửa ban đêm ở khu nguy hiểm</td><td>Avoidance (đóng cửa sớm) hoặc loss reduction (bảo vệ)</td><td>Rủi ro rõ ràng, có thể tránh</td></tr></table>`}]},

{ id:"n14", ch:"c4", src:"đề luyện", topic:"Claim settlement", title:"Bão và khoản bồi thường bị đề nghị thấp",
scenario:`<p>After a typhoon, an insurer receives 500 claims in a week and lacks staff. Mr. An's roof claim is estimated by an expert at VND 75 million, but the adjuster offers VND 30 million and says he will have to sue if he wants more.</p>`,
parts:[

<script>
window.CALC = {
  acv: function(rc, dep){ var d = rc*dep/100; return {dep:d, acv: rc-d}; },
  avg: function(V, SI, L){ if (SI >= V) return Math.min(L, SI); return Math.min(L*SI/V, SI); },
  straight: function(L, D){ return L > D ? L - D : 0; },
  franchise: function(L, D){ return L > D ? L : 0; },
  disappearing: function(L, D, rate){ if (L <= D) return {ded:D, pay:0}; var ded = Math.max(0, D - rate*(L-D)); return {ded:ded, pay:L-ded}; },
  aggregate: function(losses, D){ var cum = 0, out = []; for (var i=0;i<losses.length;i++){ var L = losses[i]; var remain = D - Math.min(cum, D); cum += L; out.push(Math.max(0, L - remain)); } return out; },
  contribution: function(sis, L){ var T = sis.reduce(function(a,b){return a+b;},0); return sis.map(function(s){ return T>0 ? Math.min(s, L*s/T) : 0; }); },
  quota: function(L, retainPct){ return {ceding: L*retainPct/100, re: L*(100-retainPct)/100}; },
  xl: function(L, R, A){ var re = Math.min(Math.max(L-R,0), A); return {re:re, ceding:L-re}; }
};

</script>
<script>
(function(){
"use strict";
var CHN = {c1:"Chương 1", c2:"Chương 2", c4:"Chương 4"};
var CHS = ["c1","c2","c4"];
function hash(s){ var h=5381; for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmt(n){ return (Math.round(n*100)/100).toLocaleString("en-US"); }

/* ---------- data ---------- */
var CARDS = window.CARDS.map(function(c){ return {id:"f"+hash(c[0]+c[1]), ch:c[0], f:c[1], b:c[2]}; });
var QUIZ = window.QUIZ.map(function(q){ return {id:"q"+hash(q[0]+q[2]), ch:q[0], t:q[1], q:q[2], o:q[3], a:q[4], w:q[5]}; });

var THEORY = window.THEORY.slice().sort(function(a,b){ return CHS.indexOf(a.id)-CHS.indexOf(b.id); });
var SECS = []; THEORY.forEach(function(c){ c.sections.forEach(function(s){ s.ch=c.id; SECS.push(s); }); });

/* ---------- state ---------- */
var KEY = "nlbh-midterm-v1";
var S = {fc:{}, qz:{}, sa:{}, cs:{}, rd:{}, mock:[], theme:"", tab:"home"};
try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); for (var k in S) if (o[k] !== undefined) S[k] = o[k]; } } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function applyTheme(){ var r=document.documentElement; if (S.theme) r.setAttribute("data-theme", S.theme); else r.removeAttribute("data-theme"); }
applyTheme();

/* ---------- ui state (not saved) ---------- */
var U = {
  th:{ch:"c1", sec:null, q:""},
  fc:{ch:"all", hideKnown:false, deck:null, i:0, flip:false},
  qz:{ch:"all", t:"all", wrong:false, run:null},
  sa:{ch:"all", list:null, i:0, show:false},
  cs:{ch:"all", open:null, shown:{}},
  mock:null, timer:null, io:{open:false, msg:""}, confirmReset:false
};
var $app = document.getElementById("app");

/* ---------- helpers ---------- */
function pct(a,b){ return b? Math.round(100*a/b) : 0; }
function bar(p, cls){ return '<div class="bar '+(cls||"")+'"><i style="width:'+p+'%"></i></div>'; }
function chChips(cur, act){ var h='<div class="chips" role="group" aria-label="Chọn chương">'; [["all","Tất cả"],["c1","Chương 1"],["c2","Chương 2"],["c4","Chương 4"]].forEach(function(c){ h+='<button class="chip" data-a="'+act+'" data-v="'+c[0]+'" aria-pressed="'+(cur===c[0])+'">'+c[1]+'</button>'; }); return h+'</div>'; }
function byCh(arr, ch){ return ch==="all"? arr : arr.filter(function(x){ return x.ch===ch; }); }
function stats(ch){
  var f=byCh(CARDS,ch), q=byCh(QUIZ,ch), s=byCh(SHORT,ch), c=byCh(CASES,ch), r=byCh(SECS,ch);
  var fk=f.filter(function(x){return S.fc[x.id]==="k";}).length;
  var qk=q.filter(function(x){return S.qz[x.id] && S.qz[x.id].ok;}).length;
  var qa=q.filter(function(x){return S.qz[x.id];}).length;
  var sk=s.filter(function(x){return S.sa[x.id]==="g";}).length;
  var ck=c.filter(function(x){return S.cs[x.id];}).length;
  var rk=r.filter(function(x){return S.rd[x.id];}).length;
  var tot=f.length+q.length+s.length+c.length+r.length, done=fk+qk+sk+ck+rk;
  return {f:f.length,fk:fk,q:q.length,qk:qk,qa:qa,s:s.length,sk:sk,c:c.length,ck:ck,r:r.length,rk:rk,tot:tot,done:done,p:pct(done,tot)};
}
function wrapTables(root){ var ts=root.querySelectorAll(".prose table"); for (var i=0;i<ts.length;i++){ var t=ts[i]; if (t.parentNode.className==="tw") continue; var w=document.createElement("div"); w.className="tw"; t.parentNode.insertBefore(w,t); w.appendChild(t); } }

/* ---------- shell ---------- */
var TABS = [["home","Tổng quan"],["theory","Lý thuyết"],["cards","Flashcard"],["quiz","Trắc nghiệm"],["short","Tự luận ngắn"],["cases","Case"],["calc","Công cụ tính"],["mock","Thi thử"]];
function shell(inner){
  var all=stats("all");

  h+='<nav class="tabs" aria-label="Mục chính">';
  TABS.forEach(function(t){ h+='<button class="tab" data-a="tab" data-v="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>'; });
  h+='</nav></div></div><main class="wrap" id="main">'+inner+'</main>';
  return h;
}
function render(keepScroll){
  var y = window.scrollY;
  var inner="";

  else if (S.tab==="theory") inner=vTheory();
  else if (S.tab==="cards") inner=vCards();
  else if (S.tab==="quiz") inner=vQuiz();
  else if (S.tab==="short") inner=vShort();
  else if (S.tab==="cases") inner=vCases();
  else if (S.tab==="calc") inner=vCalc();
  else if (S.tab==="mock") inner=vMock();
  $app.innerHTML = shell(inner);

  if (S.tab==="calc") calcAll();
  if (keepScroll) window.scrollTo(0,y);
}

/* ---------- home ---------- */
function vHome(){
  var h='<div class="eyebrow">Ôn thi giữa kỳ · Chương 1, 2, 4</div><h2 class="page">Bắt đầu từ chỗ còn yếu</h2>';
  h+='<p class="lede">Đề đóng sách, câu ngắn, kiến thức rộng. Trang này gom toàn bộ slide, các case cô giao và đề luyện thêm. Tiến độ lưu trên trình duyệt này.</p>';

  });
  h+='</div>';
  h+='<div class="row" style="margin-top:16px"><button class="btn primary" data-a="goWrong"'+(wrong? '':' disabled')+'>Ôn lại câu trả lời sai ('+wrong+')</button><button class="btn" data-a="tab" data-v="mock">Làm đề thi thử</button><button class="btn" data-a="tab" data-v="cards">Lật flashcard</button></div>';
  h+='<div class="hr"></div><div class="grid g2"><div class="card prose"><h4 style="margin-top:0">Cách học trong 4 vòng</h4><ol>';
  h+='<li><b>Hiểu:</b> đọc mỗi mục trong tab Lý thuyết, tự nhắc lại định nghĩa bằng lời của mình rồi tick "Đã đọc".</li>';
  h+='<li><b>Nhớ:</b> lật flashcard, chỉ đánh "Đã nhớ" khi nói được ra trước khi lật.</li>';
  h+='<li><b>Gọi lại:</b> làm Tự luận ngắn bằng cách viết đáp án trước rồi mới xem đáp án mẫu. Đây là dạng gần đề thi nhất.</li>';
  h+='<li><b>Vận dụng:</b> làm các Case (che đáp án), sau đó làm đề Thi thử có giờ.</li></ol><p class="note">Câu sai ở Trắc nghiệm được lưu để ôn lại.</p></div>';
  h+='<div class="card prose"><h4 style="margin-top:0">Công thức phải thuộc</h4><div class="formula">ACV = Replacement cost − Depreciation<br>Average = Loss × (Sum insured / Value at risk)<br>Straight = Loss − D (nếu Loss &gt; D)<br>Franchise = Loss (nếu Loss &gt; D), ngược lại 0<br>Contribution = Loss × (SI của mình / Tổng SI)<br>Quota share = Loss × % nhượng<br>XL = min(max(Loss − Retention, 0), Limit)</div>';
  h+='<p class="note">Property: insurable interest lúc <b>tổn thất</b>. Life: lúc <b>ký hợp đồng</b>.</p></div></div>';
  h+='<div class="hr"></div>'+vData();
  return h;

  var h='<div class="card"><h4 style="margin:0 0 6px;font-family:var(--f-display)">Dữ liệu học của bạn</h4><p class="note" style="margin:0 0 10px">Tiến độ nằm trong trình duyệt này. Muốn chuyển sang thiết bị khác, sao chép đoạn JSON rồi dán vào máy kia.</p><div class="row">';

/* ---------- theory ---------- */
function stripHtml(s){ return s.replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," "); }
function vTheory(){
  var t=U.th;
  var list = SECS.filter(function(s){ return s.ch===t.ch; });
  var q = t.q.trim().toLowerCase();
  var hits = null;
  if (q) hits = SECS.filter(function(s){ return (s.title+" "+stripHtml(s.html)).toLowerCase().indexOf(q)>=0; });
  var cur;
  if (q && hits.length){ cur = hits.filter(function(s){return s.id===t.sec;})[0] || hits[0]; }
  else { cur = list.filter(function(s){return s.id===t.sec;})[0] || list[0]; }
  var h='<div class="eyebrow">Lý thuyết theo slide</div><h2 class="page">Đọc, nhắc lại, tick</h2>';

    if (idx>0) h+='<button class="btn" data-a="thSec" data-v="'+SECS[idx-1].id+'" data-ch="'+SECS[idx-1].ch+'">Mục trước</button>';
    if (idx<SECS.length-1) h+='<button class="btn" data-a="thSec" data-v="'+SECS[idx+1].id+'" data-ch="'+SECS[idx+1].ch+'">Mục sau</button>';

/* ---------- flashcards ---------- */
function fcBuild(shuf){
  var f=U.fc, d=byCh(CARDS,f.ch);
  if (f.hideKnown) d=d.filter(function(c){ return S.fc[c.id]!=="k"; });
  if (shuf) d=shuffle(d);

function cardById(id){ return CARDS.filter(function(c){return c.id===id;})[0]; }
function vCards(){
  var f=U.fc; if(!f.deck) fcBuild(false);

/* ---------- quiz ---------- */
function qzPool(){
  var q=U.qz; var p=byCh(QUIZ,q.ch);
  if (q.t!=="all") p=p.filter(function(x){return x.t===q.t;});
  if (q.wrong) p=p.filter(function(x){return S.qz[x.id] && !S.qz[x.id].ok;});
  return p;
}
function qzStart(){
  var p=shuffle(qzPool()).slice(0,20);
  U.qz.run = {items:p.map(function(x){
    var opts=x.o.map(function(t,i){return {t:t,i:i};});
    if (x.t==="mcq") opts=shuffle(opts);
    return {q:x, opts:opts, pick:null};
  }), i:0, score:0};
}
function vQuiz(){
  var q=U.qz, h='<div class="eyebrow">Trắc nghiệm và đúng/sai · '+QUIZ.length+' câu</div><h2 class="page">Chọn, đọc giải thích, nhớ lý do</h2>';
  if (!q.run){
    var pool=qzPool();
    var wrong=QUIZ.filter(function(x){ return S.qz[x.id] && !S.qz[x.id].ok; }).length;
    h+='<div class="card stack"><div><label class="lab">Chương</label>'+chChips(q.ch,"qzCh")+'</div>';
    h+='<div><label class="lab">Dạng câu</label><div class="chips">';

  saGot:function(){ var x=saList()[U.sa.i]; S.sa[x.id]="g"; save(); A.saNav({dataset:{v:"1"}}); },
  saMiss:function(){ var x=saList()[U.sa.i]; S.sa[x.id]="m"; save(); A.saNav({dataset:{v:"1"}}); },
  saNav:function(t){ var l=saList(); var n=U.sa.i+parseInt(t.dataset.v,10); U.sa.i=Math.max(0,Math.min(l.length-1,n)); U.sa.show=false; render(); },
  saRand:function(){ var l=saList().map(function(x,i){return {x:x,i:i};}).filter(function(o){return S.sa[o.x.id]!=="g";}); if(l.length){ U.sa.i=l[Math.floor(Math.random()*l.length)].i; U.sa.show=false; render(); } },
  csCh:function(t){ U.cs.ch=t.dataset.v; render(); },

  mockStart:function(){ mockNew(); render(); window.scrollTo(0,0); },
  mockPick:function(t){ var m=U.mock; if(m.submitted) return; m.qs[parseInt(t.dataset.n,10)].pick=parseInt(t.dataset.v,10); render(true); },
  mockSubmit:function(){ mockSubmit(); window.scrollTo(0,0); },
  mockShow:function(t){ U.mock.shown[t.dataset.v]=true; render(true); },
  ioExport:function(){ U.io={open:true,mode:"export",text:exportJson(),msg:""}; render(true); },
  ioImportOpen:function(){ U.io={open:true,mode:"import",text:"",msg:"Dán JSON đã xuất vào ô bên dưới rồi bấm Áp dụng."}; render(true); },
  ioClose:function(){ U.io={open:false,msg:""}; render(true); },
  ioCopy:function(){ var ta=document.getElementById("iobox"); try{ navigator.clipboard.writeText(ta.value).then(function(){ U.io.msg="Đã sao chép."; render(true); },function(){ ta.select(); U.io.msg="Chọn sẵn văn bản, bấm Ctrl+C để sao chép."; render(true); }); }catch(e){ ta.select(); } },
  ioImport:function(){ var ta=document.getElementById("iobox"); try{ var o=JSON.parse(ta.value); var n={fc:{},qz:{},sa:{},cs:{},rd:{},mock:[]}; for(var k in n){ if(o[k]!==undefined) n[k]=o[k]; } for(var k2 in n) S[k2]=n[k2]; save(); U.io={open:false,msg:"Đã nhập tiến độ."}; render(true); }catch(e){ U.io.msg="JSON không hợp lệ."; U.io.text=ta.value; render(true); } },
  resetAsk:function(){ U.confirmReset=true; render(true); },

};
document.addEventListener("click", function(e){
  var t=e.target.closest("[data-a]"); if(!t) return;
  var f=A[t.dataset.a]; if(f){ e.preventDefault(); f(t); }
});
document.addEventListener("input", function(e){
  var t=e.target;
  if (t.id==="thq"){ U.th.q=t.value; var pos=t.selectionStart; render(); var n=document.getElementById("thq"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } }
  else if (t.dataset && t.dataset.calc){ calcAll(); }
});
document.addEventListener("keydown", function(e){
  if (S.tab!=="cards") return; var tg=e.target.tagName; if (tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT") return;
  if (e.key===" "){ e.preventDefault(); A.fcFlip(); } else if (e.key==="ArrowRight"){ A.fcNext(); } else if (e.key==="ArrowLeft"){ A.fcPrev(); }
});

var hs=(location.hash||"").replace("#",""); if (TABS.some(function(t){return t[0]===hs;})) S.tab=hs;
render();
